[project]
name = "wavyos"
version = "0.2.0"
description = "Wavy Studios Lifecycle Client Operating System: backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "sqlalchemy>=2.0",
  "pydantic>=2.7",
  "httpx>=0.27",
  "cryptography>=43",
  "anthropic>=1.13",
  "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
wavyos = "wavyos.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wavyos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
