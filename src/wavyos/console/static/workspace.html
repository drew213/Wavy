<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Wavy Client Hub</title>
<style>
@font-face { font-family: Geist; src: url('/assets/geist-latin.woff2') format('woff2'); font-display: swap; }
@font-face { font-family: GeistMono; src: url('/assets/geist-mono-latin.woff2') format('woff2'); font-display: swap; }
:root {
  --background: #0b0c0d; --foreground: #f6f6f3; --card: #121415; --muted: #1b1e20; --muted-foreground: #a0a5a8;
  --primary: #c8ff00; --accent: #242a1a; --accent-foreground: #d6ff67; --destructive: #ff8069; --warn: #e9c485; --blue: #4a9eff;
  --border: #2b2e2f; --input: #404546; --sidebar: #101213; --sidebar-foreground: #b4b8ba; --sidebar-accent: #252e16;
  --mono: GeistMono, ui-monospace, monospace;
}
* { box-sizing: border-box; }
html { color-scheme: dark; }
body { margin: 0; background: var(--background); color: var(--foreground); font: 16px/1.55 Geist, Arial, sans-serif; }
button, a, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
a:focus-visible, button:focus-visible, select:focus-visible, summary:focus-visible { outline: 2px solid var(--primary); outline-offset: 3px; }
h1, h2, h3, h4, p { margin: 0; }
h1 { font-size: 40px; line-height: 1.15; letter-spacing: -1.6px; font-weight: 650; text-wrap: balance; }
h2 { font-size: 20px; font-weight: 600; letter-spacing: -.4px; }
h3 { font-weight: 600; line-height: 1.4; }
h4 { font-size: 13px; font-weight: 500; color: #c0c8ca; }
p { color: #b1b6b8; }
small { font-size: 13px; }
[hidden] { display: none !important; }
svg.i { width: 17px; height: 17px; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* Shell */
.shell { display: flex; min-height: 100dvh; }
.sidebar { width: 245px; flex-shrink: 0; background: var(--sidebar); border-right: 1px solid var(--border); color: var(--sidebar-foreground);
  position: sticky; top: 0; height: 100dvh; display: flex; flex-direction: column; overflow-y: auto; }
.brand { padding: 31px 28px 22px; display: grid; gap: 18px; }
.brand img { width: 158px; height: auto; }
.eyebrow { font: 12px var(--mono); letter-spacing: 1.8px; color: #a2a9ab; }
.client-block { margin: 10px 18px 24px; padding: 16px 10px; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 13px; }
.client-monogram { display: grid; place-items: center; width: 36px; height: 36px; background: #2b3022; color: #dcff72; font-weight: 650; font-size: 19px; flex-shrink: 0; }
.client-block strong { display: block; color: var(--foreground); font-size: 16px; overflow-wrap: anywhere; }
.client-block small { display: block; color: #92999c; font-size: 12px; }
.nav-label { font: 12px var(--mono); letter-spacing: 1px; padding: 0 28px 12px; color: #777f83; }
.nav { list-style: none; margin: 0; padding: 0 14px; display: grid; gap: 4px; }
.nav button { width: 100%; height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 14px; font-size: 14px; text-align: left;
  background: none; border: 0; border-left: 2px solid transparent; color: var(--sidebar-foreground); }
.nav button:hover { background: #1a1e1f; color: var(--foreground); }
.nav button[aria-current="page"] { border-left-color: var(--primary); background: var(--sidebar-accent); color: var(--accent-foreground); }
.nav .dot { margin-left: auto; width: 7px; height: 7px; border-radius: 50%; background: #4b5558; flex-shrink: 0; }
.dot.ready { background: #9fd356; } .dot.partial { background: var(--warn); } .dot.unavailable { background: var(--destructive); }
.dot.collecting { background: var(--blue); }
.sidebar-bottom { margin-top: auto; padding: 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; font-size: 12px; color: #8e9699; }
.fresh { display: flex; align-items: center; gap: 12px; width: 100%; padding: 14px 0; margin-bottom: 10px; border: 0; border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border); background: none; color: #d8e3d0; text-align: left; }
.fresh > svg { color: var(--primary); }
.fresh strong { display: block; font-size: 14px; font-weight: 500; }
.fresh small { display: block; font-size: 13px; line-height: 1.4; color: #9ca9af; margin-top: 3px; }
.fresh:hover strong { color: var(--primary); }
.sidebar-bottom .private { display: flex; align-items: center; gap: 8px; width: 100%; }
.sidebar-bottom .private svg { width: 15px; height: 15px; }
.exit { color: #c9cecf; text-decoration: underline; text-underline-offset: 3px; }
.exit:hover { color: var(--primary); }
.sidebar-bottom > small { width: 100%; margin-top: 14px; font: 10px var(--mono); letter-spacing: 1px; }
.scrim { display: none; }

.workspace { min-width: 0; flex: 1; display: flex; flex-direction: column; }
.topbar { height: 75px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 18px; padding: 0 40px; position: sticky; top: 0; z-index: 5; background: var(--background); }
.trigger { display: none; background: none; border: 0; color: #c9cecf; padding: 4px; }
.breadcrumbs { display: flex; align-items: center; gap: 15px; font-size: 14px; color: #989fa2; min-width: 0; }
.breadcrumbs span:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.breadcrumbs strong { font-weight: 500; color: #e9ecec; white-space: nowrap; }
.slash { color: #4b5558; }
.snapshot { margin-left: auto; color: #b6bcbc; font-size: 12px; white-space: nowrap; }
.version { background: var(--card); border: 1px solid var(--input); color: #e9ecec; font-size: 12px; padding: 6px 8px; border-radius: 0; }
.avatar { width: 31px; height: 31px; border: 1px solid #454c3c; background: #242b1b; display: grid; place-items: center; font-size: 13px; color: var(--primary); flex-shrink: 0; }
main { padding: 38px 40px; max-width: 1600px; width: 100%; margin: 0 auto; flex: 1; }
.page-heading { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 26px; gap: 15px; }
.page-heading .eyebrow { color: #b5e833; margin-bottom: 12px; }
.page-heading p:last-child { margin-top: 12px; font-size: 15px; max-width: 760px; }
.heading-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.page-footer { border-top: 1px solid var(--border); padding: 22px 40px; display: flex; justify-content: space-between; gap: 16px; font-size: 13px; color: #8e9699; }

/* Building blocks */
.metrics-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid var(--border); background: var(--card); margin-bottom: 24px; }
.metrics-grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.metrics-grid.five { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.metric { padding: 22px; border-right: 1px solid var(--border); min-width: 0; }
.metric:last-child { border-right: 0; }
.metric-label { font-size: 14px; color: #c0c8ca; margin-bottom: 15px; min-height: 2.6em; }
.metric strong { display: block; font-size: 32px; line-height: 1.1; font-weight: 600; letter-spacing: -1.2px; overflow-wrap: anywhere; }
.metric strong.lime { color: var(--primary); }
.metric strong.na { font-size: 20px; color: #9ba6ad; letter-spacing: 0; font-weight: 500; }
.metric p { font-size: 13px; margin-top: 10px; line-height: 1.5; }
.delta { font: 12px var(--mono); margin-top: 8px; display: inline-block; }
.delta.up { color: #9fd356; } .delta.down { color: var(--destructive); }
details.basis { margin-top: 12px; font-size: 12px; }
details.basis summary { cursor: pointer; color: #8f9a9e; font: 11px var(--mono); letter-spacing: .6px; list-style: none; }
details.basis summary::-webkit-details-marker { display: none; }
details.basis summary::before { content: '+ '; }
details.basis[open] summary::before { content: '− '; }
details.basis dl { margin: 8px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; color: #b1b6b8; }
details.basis dt { color: #7f898d; } details.basis dd { margin: 0; overflow-wrap: anywhere; }
.panel { border: 1px solid var(--border); background: var(--card); padding: 27px; min-width: 0; margin-bottom: 24px; }
.panel-head { display: flex; justify-content: space-between; align-items: start; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
.panel-head p { font-size: 13px; margin-top: 6px; }
.grid-2 { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 24px; }
.grid-even { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; }
.notice { display: flex; gap: 14px; align-items: flex-start; padding: 17px 20px; background: #151a1d; border: 1px solid #2b363b; margin-bottom: 24px; }
.notice > svg { margin-top: 3px; color: #9cafb7; }
.notice p { font-size: 14px; line-height: 1.65; }
.notice strong { color: var(--warn); font-weight: 500; }
.notice.partial { border-color: #5c4a2c; background: #1d1912; }
.notice.unavailable { border-color: #5c3128; background: #1f1310; }
.notice.unavailable strong { color: var(--destructive); }
.notice.collecting { border-color: #24415f; background: #10171f; }
.notice.collecting strong { color: #8ec3ff; }
.notice.review strong { color: var(--accent-foreground); }
.stages { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 4px; font-size: 13px; }
.stages li { display: flex; gap: 8px; color: #b1b6b8; }
.stages b { font: 11px var(--mono); width: 92px; flex-shrink: 0; text-transform: uppercase; color: #8f9a9e; font-weight: 400; }
.stages b.done { color: #9fd356; } .stages b.running { color: #8ec3ff; } .stages b.failed, .stages b.skipped { color: var(--destructive); }
.tag { font: 11px var(--mono); letter-spacing: .6px; padding: 4px 8px; border: 1px solid var(--input); color: #c9cecf; white-space: nowrap; text-transform: uppercase; display: inline-block; }
.tag.live, .tag.pass { color: #b9e86a; border-color: #4b5f2b; background: #1b2315; }
.tag.off, .tag.warn, .tag.medium { color: var(--warn); border-color: #5c4a2c; background: #241e14; }
.tag.missing, .tag.fail, .tag.critical, .tag.high { color: var(--destructive); border-color: #5c3128; background: #24150f; }
.tag.low, .tag.na { color: #a9b3b7; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 13px; padding: 4px 10px; background: var(--muted); border: 1px solid var(--border); color: #d9dddd; }
.chip.no { color: #f0b3a6; border-color: #47302a; }
.empty { color: #8e9699; font-size: 14px; }
.btn { background: var(--muted); border: 1px solid var(--input); color: #e9ecec; font-size: 13px; padding: 7px 12px; white-space: nowrap; }
.btn:hover { border-color: var(--primary); color: var(--primary); }
.btn.small { font-size: 12px; padding: 4px 9px; }

/* Findings */
.findings { display: grid; gap: 12px; margin-bottom: 24px; }
.finding { border: 1px solid var(--border); border-left: 3px solid var(--warn); background: var(--card); padding: 20px 22px; }
.finding.critical, .finding.high { border-left-color: var(--destructive); }
.finding.low { border-left-color: #4b5558; }
.finding header { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-bottom: 10px; }
.finding h3 { font-size: 17px; color: #edf0e7; }
.finding dl { display: grid; grid-template-columns: 82px 1fr; gap: 6px 14px; margin: 0; font-size: 14px; }
.finding dt { font: 11px/1.9 var(--mono); letter-spacing: .6px; color: #8f9a9e; text-transform: uppercase; }
.finding dd { margin: 0; color: #d9dddd; overflow-wrap: anywhere; }
.finding dd.action { color: #eef0e8; }
.finding.read { border-left-color: var(--primary); }

/* The strategist's read: approved written analysis */
.story { border: 1px solid #3a4a17; background: linear-gradient(180deg, #171d0f, var(--card)); padding: 24px; margin-bottom: 24px; }
.story-head { display: flex; justify-content: space-between; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
.story-head .eyebrow { color: #b5db57; }
.story h2 { font-size: 23px; line-height: 1.35; color: #f2f5ea; max-width: 880px; }
.story .findings { margin: 20px 0 0; }
.story .owner { font: 11px/1.9 var(--mono); letter-spacing: .6px; color: #9ba6ad; text-transform: uppercase; }
.weeks-list { display: grid; gap: 10px; margin-top: 18px; }
.week { display: grid; grid-template-columns: 74px 1fr; gap: 14px; padding: 14px 0; border-top: 1px solid var(--border); }
.week b { font: 12px/1.6 var(--mono); color: #c8ff00; letter-spacing: .6px; }
.week ul { margin: 6px 0 0; padding-left: 18px; font-size: 14px; color: #d9dddd; }
@media (max-width: 500px) { .story { padding: 18px; } .story h2 { font-size: 19px; } .week { grid-template-columns: 1fr; gap: 4px; } }

/* Opportunities board */
.board { border: 1px solid var(--border); background: var(--card); margin-bottom: 24px; }
.board-heading { padding: 24px; }
.board-heading .eyebrow { color: #b5db57; margin-bottom: 9px; }
.board-heading h2 { font-size: 25px; }
.board-heading p:last-child { font-size: 15px; margin-top: 8px; max-width: 760px; }
.toolbar { padding: 0 24px 20px; display: flex; justify-content: space-between; align-items: center; gap: 14px; flex-wrap: wrap; }
.toolbar > span { color: #9fa9ad; font-size: 14px; }
.sort { display: flex; gap: 7px; flex-wrap: wrap; }
.sort button { background: var(--muted); border: 1px solid var(--input); color: #e9ecec; font-size: 14px; padding: 7px 13px; }
.sort button[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: #0a0a0a; }
.op-layout { display: grid; grid-template-columns: minmax(265px, .85fr) minmax(0, 1.65fr); border-top: 1px solid var(--border); }
.op-list { border-right: 1px solid var(--border); background: #101213; max-height: 980px; overflow-y: auto; }
.op-item { width: 100%; border: 0; border-bottom: 1px solid var(--border); border-left: 3px solid transparent; background: none; display: flex; align-items: start; gap: 15px; text-align: left; padding: 20px; color: inherit; }
.op-item[aria-pressed="true"] { border-left-color: var(--primary); background: #1b2315; }
.op-item:hover { background: #1c2220; }
.op-rank { font: 18px var(--mono); color: var(--primary); line-height: 1.5; }
.op-item h3 { font-size: 16px; color: #edf0e7; }
.op-meta { display: flex; gap: 8px; flex-wrap: wrap; font-size: 13px; color: #b4c09f; margin-top: 6px; }
.op-meta span + span::before { content: '·'; margin-right: 8px; }
.op-detail { padding: 27px; min-width: 0; }
.op-detail-heading { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
.op-label { font: 12px/1.5 var(--mono); letter-spacing: .7px; color: #a9c678; }
.op-detail > h3 { font-size: 27px; letter-spacing: -.65px; line-height: 1.25; margin-bottom: 15px; }
.op-observation { font-size: 16px; line-height: 1.65; }
.op-evidence { font-size: 14px; margin-top: 12px; }
.op-outcome { border-left: 2px solid var(--primary); background: #171c12; padding: 18px 20px; margin: 22px 0; }
.op-outcome p { color: #eef0e8; margin-top: 8px; font-size: 16px; }
.op-outcome small { display: block; color: #9ba6ad; margin-top: 8px; font-size: 12px; }
.op-reasons { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 24px; padding: 20px 0; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
.op-reasons strong { display: block; font-size: 22px; font-weight: 600; letter-spacing: -.6px; margin: 6px 0 4px; }
.op-reasons p { font-size: 13px; }
.op-steps { margin: 18px 0 0; padding-left: 20px; display: grid; gap: 8px; color: #d9dddd; font-size: 15px; }
.top3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-bottom: 24px; }
.top3 a { display: block; text-decoration: none; border: 1px solid var(--border); background: var(--card); padding: 20px; border-top: 3px solid var(--primary); }
.top3 a:hover { background: #171c12; }
.top3 h3 { font-size: 17px; margin: 8px 0; color: #edf0e7; }
.top3 p { font-size: 14px; }

/* Charts and tables */
.bars { display: flex; align-items: end; gap: 6px; height: 240px; border-bottom: 1px solid var(--border); }
.bar-col { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; height: 100%; justify-content: end; }
.bar-track { height: 190px; width: 100%; display: flex; align-items: end; justify-content: center; position: relative; }
.bar { background: #3b4430; width: 74%; max-width: 46px; min-height: 2px; position: relative; }
.bar i { position: absolute; bottom: 0; left: 0; right: 0; background: var(--primary); }
.bar-label { font: 10px var(--mono); margin: 10px 0; color: #9da7aa; white-space: nowrap; }
.bars.weeks { gap: 2px; height: 160px; }
.bars.weeks .bar-track { height: 130px; }
.bars.weeks .bar { width: 100%; background: var(--primary); }
.bars.weeks .bar.empty { background: #5c3128; min-height: 4px; }
.legend { display: flex; gap: 18px; font-size: 12px; color: #9da7aa; margin-top: 12px; flex-wrap: wrap; }
.legend span::before { content: ''; display: inline-block; width: 10px; height: 10px; margin-right: 6px; vertical-align: -1px; background: var(--c); }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font: 12px var(--mono); letter-spacing: .6px; color: #9da7aa; font-weight: 400; padding: 0 12px 12px 0; border-bottom: 1px solid var(--border); white-space: nowrap; }
td { padding: 11px 12px 11px 0; border-bottom: 1px solid #222628; color: #d9dddd; vertical-align: top; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
td.heat { text-align: right; font-variant-numeric: tabular-nums; }
.more { margin-top: 12px; }
.kv { display: grid; grid-template-columns: minmax(140px, 240px) 1fr; gap: 0; margin: 0; }
.kv dt { padding: 12px 16px 12px 0; border-bottom: 1px solid var(--border); font-size: 14px; color: #9ba6ad; }
.kv dd { margin: 0; padding: 12px 0; border-bottom: 1px solid var(--border); font-size: 14px; color: #e9ecec; overflow-wrap: anywhere; }

/* Journeys */
.stage-track { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); border: 1px solid var(--border); background: var(--card); margin-bottom: 24px; }
.stage { padding: 18px 14px; border-right: 1px solid var(--border); display: grid; gap: 8px; align-content: start; min-width: 0; }
.stage:last-child { border-right: 0; }
.stage .n { font: 12px var(--mono); color: #777f83; }
.stage strong { font-size: 14px; font-weight: 500; text-transform: capitalize; }
.stage small { color: #93a0a7; font-size: 12px; overflow-wrap: anywhere; }

/* Plan */
.plan-list { list-style: none; margin: 0; padding: 0; border: 1px solid var(--border); background: var(--card); margin-bottom: 24px; }
.plan-list li { display: grid; grid-template-columns: 52px 1fr auto; gap: 16px; align-items: center; padding: 18px 24px; border-bottom: 1px solid var(--border); }
.plan-list li:last-child { border-bottom: 0; }
.plan-list strong { display: block; font-weight: 500; color: #edf0e7; }
.plan-list small { color: #93a0a7; }
.email { background: #f6f6f3; color: #1b1e20; padding: 28px; font: 15px/1.7 Georgia, serif; white-space: pre-wrap; max-height: 560px; overflow: auto; }

.state { min-height: 60vh; display: grid; place-content: center; text-align: center; gap: 14px; }
.state p { max-width: 46ch; }
.state a { color: var(--primary); }

@media (max-width: 1150px) {
  .metrics-grid, .metrics-grid.five { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .metrics-grid > .metric { border-bottom: 1px solid var(--border); }
  .metrics-grid > .metric:nth-child(2n) { border-right: 0; }
  .metrics-grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .metrics-grid.three > .metric { border-bottom: 0; border-right: 1px solid var(--border); }
  .metrics-grid.three > .metric:last-child { border-right: 0; }
  .grid-2, .grid-even { grid-template-columns: 1fr; }
  .topbar { padding: 0 25px; } main { padding: 30px 25px; } .page-footer { padding: 20px 25px; }
  .stage-track { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .stage { border-bottom: 1px solid var(--border); }
  .top3 { grid-template-columns: 1fr; }
}
@media (max-width: 850px) {
  .sidebar { position: fixed; left: 0; top: 0; z-index: 30; transform: translateX(-100%); transition: transform .25s cubic-bezier(.16,1,.3,1); }
  .shell.nav-open .sidebar { transform: none; }
  .shell.nav-open .scrim { display: block; position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 20; }
  .trigger { display: inline-flex; }
  .op-layout { grid-template-columns: 1fr; }
  .op-list { border-right: 0; max-height: 420px; }
  .op-detail { border-top: 1px solid var(--border); }
}
@media (max-width: 800px) {
  .topbar { height: 64px; padding: 0 17px; gap: 10px; }
  .snapshot { display: none; }
  main { padding: 25px 17px; }
  h1 { font-size: 30px; letter-spacing: -1px; }
  .page-heading { flex-direction: column; align-items: start; }
  .heading-actions { justify-content: flex-start; }
  .metric { padding: 17px 14px; }
  .metric strong { font-size: 25px; }
  .metrics-grid.three { grid-template-columns: 1fr; }
  .metrics-grid.three > .metric { border-right: 0; border-bottom: 1px solid var(--border); }
  .panel { padding: 20px; }
  .page-footer { padding: 20px 17px; flex-direction: column; gap: 7px; }
  .stage-track { grid-template-columns: 1fr 1fr; }
  .op-reasons { grid-template-columns: 1fr; gap: 14px; }
  .op-detail { padding: 20px 17px; }
  .op-detail > h3 { font-size: 22px; }
  .bars { gap: 3px; height: 200px; } .bar-track { height: 150px; }
  .bar-label { font-size: 9px; }
  .plan-list li { grid-template-columns: 36px 1fr; padding: 16px; }
  .plan-list li > :last-child { grid-column: 2; justify-self: start; }
  .kv { grid-template-columns: 1fr; }
  .kv dt { border-bottom: 0; padding-bottom: 2px; }

}
@media (max-width: 500px) {
  .metrics-grid, .metrics-grid.five { grid-template-columns: 1fr; }
  .metrics-grid > .metric { border-right: 0 !important; }
  .stage-track { grid-template-columns: 1fr; }
  .version { max-width: 110px; }
  .metric-label { min-height: 0; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; } }
@media print {
  :root { --background: #fff; --foreground: #111; --card: #fff; --muted: #f2f2f2; --border: #ccc; --primary: #4b6b00; }
  html { color-scheme: light; }
  body { background: #fff; color: #111; font-size: 12px; }
  .sidebar, .topbar, .scrim, .page-footer, .heading-actions, .btn, .sort, details.basis summary { display: none !important; }
  main { padding: 0; max-width: none; }
  p, td, dd, .finding dd, .metric p { color: #222 !important; }
  th, dt, .metric-label, h4 { color: #444 !important; }

  .op-list { max-height: none; }
  .bar i, .bars.weeks .bar { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  a { text-decoration: none; }
}
</style>
</head>
<body>
<div class="shell" id="shell">
  <aside class="sidebar" id="sidebar" aria-label="Workspace navigation">
    <div class="brand"><img src="/assets/wavy-logo-white.png" alt="Wavy Studios"><span class="eyebrow">CLIENT WORKSPACE</span></div>
    <div class="client-block"><span class="client-monogram" id="mono" aria-hidden="true"></span><div><strong id="client-name">Loading</strong><small>Growth &amp; retention</small></div></div>
    <div class="nav-label">WORKSPACE</div>
    <nav><ul class="nav" id="nav"></ul></nav>
    <div class="sidebar-bottom">
      <button class="fresh" type="button" id="fresh">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
        <span><strong>Run a fresh audit</strong><small>Reads Klaviyo again and saves a new version</small></span>
      </button>
      <span class="private"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>Private client workspace</span>
      <a class="exit" id="exit" href="/login">Sign out</a>
      <small>WAVY STUDIOS · 2026</small>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <div class="workspace">
    <header class="topbar">
      <button class="trigger" type="button" id="trigger" aria-label="Open navigation" aria-controls="sidebar" aria-expanded="false">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/></svg>
      </button>
      <div class="breadcrumbs"><span id="crumb-client"></span><span class="slash">/</span><strong id="crumb-section"></strong></div>
      <span class="snapshot" id="snapshot"></span>
      <select class="version" id="version" hidden aria-label="Workspace version"></select>
      <span class="avatar" id="avatar" aria-hidden="true"></span>
    </header>
    <main id="main">
      <div id="progress"></div>
      <div class="page-heading" id="heading" hidden>
        <div><p class="eyebrow" id="eyebrow"></p><h1 id="title"></h1><p id="subtitle"></p></div>
        <div class="heading-actions"><button class="btn" type="button" id="print">Print / PDF</button></div>
      </div>
      <div id="view"></div>
    </main>
    <footer class="page-footer"><span id="foot-client"></span><span>USD · Audit snapshot, not a live feed · Attributed revenue is not incremental</span></footer>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const money = (n, cents) => n == null ? "—" : new Intl.NumberFormat("en-US", { style: "currency", currency: "USD", maximumFractionDigits: cents ? 2 : 0, minimumFractionDigits: cents ? 2 : 0 }).format(n);
const compact = n => n == null ? "—" : Math.abs(n) >= 1e6 ? "$" + (n / 1e6).toFixed(2) + "m" : Math.abs(n) >= 1e3 ? "$" + (n / 1e3).toFixed(1) + "k" : "$" + Math.round(n);
const pct = (n, d = 1) => n == null ? "—" : (n * 100).toFixed(d) + "%";
const num = n => n == null ? "—" : Math.round(n).toLocaleString("en-US");
const dec = (n, d = 1) => n == null ? "—" : Number(n).toFixed(d);
const day = iso => iso ? new Date(iso).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" }) : "";
const label = s => String(s ?? "").replace(/_/g, " ");
const token = () => sessionStorage.getItem("wos-token") || "";
const signIn = () => location.replace("/login?next=" + encodeURIComponent(location.pathname + location.search));
const icon = paths => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${paths}</svg>`;
const INFO = icon('<circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>');

const NAV = [
  { id: "opportunities", eyebrow: "01 / DECIDE", title: "What to fix first", sub: "Every finding from the audit, ranked: the fixes that unblock everything else first, then value against the work it takes.",
    icon: '<rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/>' },
  { id: "foundational", eyebrow: "02 / DIAGNOSE", title: "Foundational report", sub: "Every check in the library against this account: what passed, what didn't, and what we couldn't see.",
    icon: '<path d="M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.25.25 0 0 1-.48 0L9.24 2.18a.25.25 0 0 0-.48 0l-2.35 8.36A2 2 0 0 1 4.49 12H2"/>' },
  { id: "performance", eyebrow: "03 / MEASURE", title: "Performance", sub: "Store revenue against what email and SMS are credited with, by month, by flow and by order source.",
    icon: '<path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/>' },
  { id: "cohorts", eyebrow: "04 / RETAIN", title: "Customer cohorts", sub: "How often first-time buyers come back, and what they're worth, at 30 to 365 days.",
    icon: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>' },
  { id: "journeys", eyebrow: "05 / JOURNEYS", title: "Customer journeys", sub: "Every flow mapped to the customer lifecycle: what's live, what's silent, what's missing.",
    icon: '<line x1="6" x2="6" y1="3" y2="15"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 0 1-9 9"/>' },
  { id: "calendar", eyebrow: "06 / PROGRAM", title: "Send history", sub: "A year of campaigns week by week, the peak season, and which promotions actually won.",
    icon: '<rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/>' },
  { id: "capture", eyebrow: "07 / GROW", title: "Capture & reach", sub: "Sign-up forms, list growth net of unsubscribes, sendable reach and subscriptions.",
    icon: '<path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>' },
  { id: "deliverability", eyebrow: "08 / PROTECT", title: "Deliverability & messages", sub: "Where complaints and unsubscribes come from, and what's wrong inside the live emails.",
    icon: '<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/>' },
  { id: "plan", eyebrow: "09 / ACT", title: "90-day plan", sub: "The phases and week-by-week plan, the first month of work and the drafts prepared for it. Proposed until you approve it.",
    icon: '<path d="m3 17 2 2 4-4"/><path d="m3 7 2 2 4-4"/><path d="M13 6h8"/><path d="M13 12h8"/><path d="M13 18h8"/>' },
  { id: "answers", eyebrow: "10 / CONTEXT", title: "Onboarding answers", sub: "Everything the brand told us in lifecycle onboarding, in their words.",
    icon: '<path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/>' },
  { id: "brand", eyebrow: "11 / RULES", title: "Brand & guardrails", sub: "Voice, economics and the rules every message follows.",
    icon: '<path d="M12 2 2 7l10 5 10-5-10-5Z"/><path d="m2 17 10 5 10-5"/><path d="m2 12 10 5 10-5"/>' },
  { id: "sources", eyebrow: "12 / EVIDENCE", title: "Sources & definitions", sub: "Where every number comes from: the run, the metric choices, every fact and its basis.",
    icon: '<path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/>' },
];
const STATE_TEXT = { queued: "Not started", collecting: "Collecting", partial: "Partly measured", unavailable: "Unavailable", awaiting_review: "In review" };
const SEV_ORDER = { critical: 0, high: 1, medium: 2, low: 3 };

const S = { b: null, me: null, slug: "", section: "opportunities", sub: "", sort: "recommended", csv: {}, poll: null };
const sec = id => (S.b.sections || []).find(s => s.id === id) || { id, state: "queued", reason: "", facts: [], findings: [], tables: {}, data: {} };
const F = id => S.b.facts?.[id];
const T = (s, key) => s.tables?.[key] || [];

/* ---------------------------------------------------------------- formatting */
function fmtFact(f, opts = {}) {
  if (!f || f.value == null) return null;
  const v = f.value;
  switch (f.unit) {
    case "USD": return opts.compact ? compact(v) : money(v, Math.abs(v) < 100);
    case "ratio": return pct(v, opts.digits ?? 1);
    case "per week": return dec(v, 1);
    case "list": case "domain": case "interval": return String(v);
    default: return typeof v === "number" ? num(v) : String(v);
  }
}
function basis(id) {
  const f = F(id);
  if (!f) return "";
  const caveat = /attributed|flow|campaign/i.test(f.label) && f.unit === "USD" ? "Klaviyo-attributed: not incremental." :
    f.evidence_class === "inferred" ? "Derived with a stated assumption." : "";
  return `<details class="basis"><summary>METRIC BASIS</summary><dl>
    <dt>Measures</dt><dd>${esc(f.label)}</dd>
    ${f.window ? `<dt>Window</dt><dd>${esc(f.window)}</dd>` : ""}
    <dt>Time basis</dt><dd>${f.time_basis === "send" ? "Send date (credited to when the message went out)" : "Event time"}${S.b.client?.timezone ? ` · ${esc(S.b.client.timezone)}` : ""}</dd>
    <dt>Source</dt><dd>${esc(f.source || f.module)}</dd>
    <dt>Evidence</dt><dd>${esc(f.evidence_class)}${caveat ? " · " + esc(caveat) : ""}</dd>
    <dt>Fact id</dt><dd>${esc(id)}</dd></dl></details>`;
}
function metric(id, title, note = "", opts = {}) {
  const f = F(id), v = fmtFact(f, opts);
  const delta = opts.delta ? F(opts.delta) : null;
  const d = delta && delta.value != null ? `<span class="delta ${delta.value >= 0 ? "up" : "down"}">${delta.value >= 0 ? "+" : ""}${pct(delta.value, 0)} vs last year</span>` : "";
  return `<div class="metric"><div class="metric-label">${esc(title || f?.label || id)}</div>
    ${v == null ? `<strong class="na">Unavailable</strong><p>${esc(f ? f.label : "Not measured on this run.")}</p>` : `<strong class="${opts.lime ? "lime" : ""}">${esc(v)}</strong>${d}${note ? `<p>${esc(note)}</p>` : ""}`}
    ${basis(id)}</div>`;
}
const metrics = (cls, items) => `<div class="metrics-grid ${cls}">${items.join("")}</div>`;

const COLFMT = {
  money: v => money(v), cents: v => money(v, true), pct: v => pct(v), pct2: v => pct(v, 2), num: v => num(v), dec: v => dec(v), text: v => esc(v ?? "—"),
  list: v => esc(Array.isArray(v) ? v.join(", ") : v ?? "—"), date: v => esc(day(v)), bool: v => v == null ? "—" : v ? "Yes" : "No",
};
function guessFmt(k, v) {
  if (typeof v === "boolean") return "bool";
  if (Array.isArray(v)) return "list";
  if (typeof v !== "number") return "text";
  if (/rpr|per_buyer/.test(k)) return "cents";
  if (/rate|share|ratio/.test(k)) return "pct";
  if (/revenue|value|refunds|store|email|sms/.test(k)) return "money";
  return Number.isInteger(v) || Math.abs(v) >= 100 ? "num" : "dec";
}
function table(key, rows, cols, { limit = 25, title = "", note = "" } = {}) {
  rows = rows || [];
  if (!cols) {
    const first = rows.find(r => r && typeof r === "object") || {};
    cols = Object.keys(first).filter(k => !k.startsWith("_") && (first[k] === null || typeof first[k] !== "object" || Array.isArray(first[k]))).slice(0, 9)
      .map(k => [k, label(k), guessFmt(k, first[k])]);
  }
  S.csv[key] = { rows, cols };
  const shown = S.expanded?.[key] ? rows : rows.slice(0, limit);
  const isNum = f => ["money", "cents", "pct", "pct2", "num", "dec"].includes(f);
  const cell = (r, [k, , f]) => { const v = typeof k === "function" ? k(r) : r[k]; return `<td class="${isNum(f) ? "num" : ""}">${(COLFMT[f] || COLFMT.text)(v)}</td>`; };
  return `<div class="panel"><div class="panel-head"><div>${title ? `<h2>${esc(title)}</h2>` : ""}${note ? `<p>${esc(note)}</p>` : ""}</div>
      <button class="btn small" type="button" data-csv="${esc(key)}">Export CSV</button></div>
    ${rows.length ? `<div class="table-wrap"><table><thead><tr>${cols.map(([, l, f]) => `<th class="${isNum(f) ? "num" : ""}">${esc(l)}</th>`).join("")}</tr></thead>
      <tbody>${shown.map(r => `<tr>${cols.map(c => cell(r, c)).join("")}</tr>`).join("")}</tbody></table></div>
      ${rows.length > shown.length ? `<button class="btn small more" type="button" data-more="${esc(key)}">Show all ${rows.length} rows</button>` : ""}`
      : `<p class="empty">No rows on this run.</p>`}</div>`;
}
function csv(key) {
  const t = S.csv[key]; if (!t) return;
  const q = v => { const s = Array.isArray(v) ? v.join("; ") : v == null ? "" : typeof v === "object" ? JSON.stringify(v) : String(v); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const lines = [t.cols.map(c => q(c[1])).join(",")].concat(t.rows.map(r => t.cols.map(([k]) => q(typeof k === "function" ? k(r) : r[k])).join(",")));
  download(`${S.slug}-${key.replace(/[^a-z0-9]+/gi, "-")}.csv`, lines.join("\n"), "text/csv");
}
function download(name, text, type) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* ---------------------------------------------------------------- states, findings */
function stageList(run) {
  return `<ul class="stages">${(run?.stages || []).map(s => `<li><b class="${s.status === "done" || s.status === "ok" ? "done" : esc(s.status)}">${esc(s.status)}</b><span>${esc(s.label)}${s.detail ? ` · ${esc(s.detail)}` : ""}${s.error ? ` · ${esc(typeof s.error === "string" ? s.error : s.error.message || "")}` : ""}</span></li>`).join("")}</ul>`;
}
function stateBar(s) {
  if (s.state === "ready") return "";
  const text = { queued: "Not started.", collecting: "Collecting.", partial: "Partly measured.", unavailable: "Unavailable." }[s.state] || "";
  return `<div class="notice ${esc(s.state)}">${INFO}<div><p><strong>${text}</strong> ${esc(s.reason)}</p>${s.state === "collecting" ? stageList(S.b.run) : ""}</div></div>`;
}
function reviewBar(s) {
  if (s.narrative_state !== "awaiting_review" || s.state === "queued" || s.state === "collecting") return "";
  return `<div class="notice review">${INFO}<p><strong>Measured now; strategist review in progress.</strong> Every number here is read from the account. The written analysis for this section appears once your strategist has reviewed it.</p></div>`;
}
function findingCards(list, title = "What we found") {
  if (!list?.length) return "";
  const sorted = [...list].sort((a, b) => (SEV_ORDER[a.severity] ?? 9) - (SEV_ORDER[b.severity] ?? 9));
  return `<h2 style="margin:0 0 14px">${esc(title)}</h2><div class="findings">${sorted.map(f => `<article class="finding ${esc(f.severity)}" id="f-${esc(f.id)}">
    <header><h3>${esc(f.title)}</h3><span class="chips"><span class="tag ${esc(f.severity)}">${esc(f.severity)}</span><span class="tag">Proposed</span></span></header>
    <dl><dt>Finding</dt><dd>${esc(f.finding)}</dd><dt>Evidence</dt><dd>${esc(f.evidence)}</dd><dt>Action</dt><dd class="action">${esc(f.action)}</dd></dl>
    ${(f.facts || []).filter(F).length ? `<div class="chips" style="margin-top:12px">${f.facts.filter(F).map(id => `<span class="chip">${esc(F(id).label)}: ${esc(fmtFact(F(id)) ?? "unavailable")}</span>`).join("")}</div>` : ""}
  </article>`).join("")}</div>`;
}
function story(s) {
  const n = s.narrative_state === "approved" ? s.narrative : null;
  if (!n) return "";
  const when = n.reviewed_at ? ` · ${esc(day(n.reviewed_at))}` : "";
  const insights = (n.insights || []).map((x, i) => `<article class="finding read">
      <header><h3>${String(i + 1).padStart(2, "0")}</h3><span class="chips">${x.owner ? `<span class="tag">Owner ${esc(x.owner)}</span>` : ""}${x.when ? `<span class="tag">${esc(x.when)}</span>` : ""}<span class="tag">Proposed</span></span></header>
      <dl><dt>Finding</dt><dd>${esc(x.finding)}</dd><dt>Evidence</dt><dd>${esc(x.evidence)}</dd><dt>Action</dt><dd class="action">${esc(x.action)}</dd></dl>
      ${(x.facts || []).filter(F).length ? `<div class="chips" style="margin-top:12px">${x.facts.filter(F).map(id => `<span class="chip">${esc(F(id).label)}: ${esc(fmtFact(F(id)) ?? "unavailable")}</span>`).join("")}</div>` : ""}
    </article>`).join("");
  let extra = "";
  if (n.ultimate_journey?.length) extra += table("story.journey", n.ultimate_journey, [["stage", "Stage", "text"], ["node", "Flow or message", "text"], ["trigger", "Trigger", "text"], ["status", "Build", "text"], ["detail", "What changes", "text"]], { title: "The ultimate journey", note: "Proposed: live means keep, fix means change what's running, build means new." });
  if (n.calendar_90d?.length) extra += `<div class="panel"><div class="panel-head"><div><h2>The next 90 days of sends</h2><p>Proposed. Nothing is scheduled until you approve it.</p></div></div>
      <div class="weeks-list">${n.calendar_90d.map(w => `<div class="week"><b>WEEK ${esc(w.week)}</b><div><strong>${esc(w.theme)}</strong><ul>${(w.sends || []).map(x => `<li>${esc(x.channel)} · ${esc(x.segment)}: ${esc(x.idea)}${x.offer && x.offer !== "none" ? ` · ${esc(x.offer)}` : ""}</li>`).join("")}</ul></div></div>`).join("")}</div></div>`;
  if (n.phases?.length) extra += n.phases.map(p => table(`story.phase.${p.name}`, p.items || [], [["week", "Week", "text"], ["ships", "What ships", "text"], ["owner", "Owner", "text"], ["depends_on", "Needs", "text"], ["kpi", "KPI", "text"], [r => F(r.baseline_fact) ? fmtFact(F(r.baseline_fact)) ?? "unavailable" : "—", "Baseline", "text"]],
    { title: `${p.name} · weeks ${p.weeks}`, note: p.goal })).join("");
  return `<section class="story" aria-label="Strategist's read"><div class="story-head"><span class="eyebrow">STRATEGIST'S READ</span><span class="tag live">${n.status === "edited" ? "Reviewed and edited" : "Reviewed"}${when}</span></div>
    <h2>${esc(n.headline)}</h2>${insights ? `<div class="findings">${insights}</div>` : ""}</section>${extra}`;
}
const head = s => stateBar(s) + reviewBar(s) + story(s);
const readCard = id => (sec("opportunities").narrative_state === "approved" ? sec("opportunities").narrative?.cards || [] : []).find(c => c.id === id);
const waiting = s => s.state === "queued" || s.state === "collecting" || (s.state === "unavailable" && !Object.keys(s.tables || {}).length && !s.findings?.length);

/* ---------------------------------------------------------------- shell */
function renderNav() {
  $("nav").innerHTML = NAV.map(n => { const st = S.b ? sec(n.id).state : "";
    return `<li><button type="button" data-nav="${n.id}"${S.section === n.id ? ' aria-current="page"' : ""}>${icon(n.icon)}<span>${esc(sec(n.id).title || n.id)}</span><span class="dot ${esc(st)}" title="${esc(STATE_TEXT[st] || "Ready")}"></span></button></li>`; }).join("");
}
function navigate(hash, push = true) {
  let [id, sub] = String(hash || "").split("/");
  if (!NAV.some(n => n.id === id)) id = "opportunities";
  S.section = id; S.sub = sub ? decodeURIComponent(sub) : "";
  if (push) history.replaceState(null, "", location.pathname + location.search + "#" + id + (sub ? "/" + sub : ""));
  renderNav(); closeNav(); render();
  if (S.sub && S.section !== "opportunities") document.getElementById(S.sub)?.scrollIntoView({ block: "start" });
  else window.scrollTo({ top: 0, behavior: "instant" });
}
function openNav() { $("shell").classList.add("nav-open"); $("trigger").setAttribute("aria-expanded", "true"); }
function closeNav() { $("shell").classList.remove("nav-open"); $("trigger").setAttribute("aria-expanded", "false"); }

function render() {
  const n = NAV.find(x => x.id === S.section), s = sec(S.section);
  $("crumb-section").textContent = s.title || n.title;
  $("heading").hidden = false;
  $("eyebrow").textContent = n.eyebrow;
  $("title").textContent = n.title;
  $("subtitle").textContent = n.sub;
  S.csv = {};
  const ip = S.b.in_progress;
  $("progress").innerHTML = ip ? `<div class="notice collecting">${INFO}<div><p><strong>A fresh audit is running.</strong> This page shows the last finished version until it's done.</p>${stageList(ip)}</div></div>` : "";
  $("view").innerHTML = VIEWS[S.section](s);
  wire();
}

/* ---------------------------------------------------------------- views */
const VIEWS = {
  opportunities(s) {
    const d = s.data || {}, cards = [...(d.opportunities || [])], kpi = sec("opportunities");
    const lead = T(kpi, "kpi_scorecard.selected");
    const sorters = {
      recommended: (a, b) => a.rank - b.rank,
      severity: (a, b) => (SEV_ORDER[a.severity] ?? 9) - (SEV_ORDER[b.severity] ?? 9) || a.rank - b.rank,
      easiest: (a, b) => (a.effort_days || 0) - (b.effort_days || 0) || a.rank - b.rank,
    };
    cards.sort(sorters[S.sort]);
    let idx = Math.max(0, cards.findIndex(c => c.id === S.sub));
    const rc = cards[idx] && readCard(cards[idx].id);
    const sel = rc ? { ...cards[idx], observation: rc.observation || cards[idx].observation, outcome: rc.outcome || cards[idx].outcome,
      steps: rc.steps?.length ? rc.steps : cards[idx].steps, effort_days: rc.effort_days ?? cards[idx].effort_days, readout: rc.readout || cards[idx].readout, reviewed: true } : cards[idx];
    const sized = c => c.sizing && c.sizing.status === "sized";
    const total = d.total?.annual;
    const kpis = lead.length ? metrics(lead.length >= 5 ? "five" : lead.length === 3 ? "three" : "", lead.slice(0, 5).map(k => metric(`kpi_scorecard.${k.kpi}.last_month`, `${k.label}, last full month`, "", { delta: `kpi_scorecard.${k.kpi}.yoy_3m`, compact: true }))) : "";
    const top = cards.slice().sort(sorters.recommended).slice(0, 3);
    let detail = `<p class="empty">Nothing to rank yet.</p>`;
    if (sel) {
      const z = sel.sizing;
      detail = `<div class="op-detail-heading"><span class="op-label">${String(sel.rank).padStart(2, "0")} · ${esc(label(sel.category)).toUpperCase()}${sel.check_id ? " · " + esc(sel.check_id) : ""}</span>
          <span class="chips"><span class="tag ${esc(sel.severity)}">${esc(sel.severity)}</span><span class="tag">${esc(sel.status)}</span><span class="tag">Owner ${esc(sel.owner)}</span>${sel.reviewed ? `<span class="tag live">Strategist detail</span>` : ""}</span></div>
        <h3>${esc(sel.title)}</h3>
        <p class="op-observation">${esc(sel.observation)}</p>
        ${sel.evidence_text ? `<p class="op-evidence">${esc(sel.evidence_text)}</p>` : (sel.evidence || []).length ? `<p class="op-evidence">${(sel.evidence || []).slice(0, 4).map(e => esc(e.note || e.detail || e.ref || "")).filter(Boolean).join(" · ")}</p>` : ""}
        <div class="op-outcome"><span class="op-label">OUTCOME TO AIM FOR</span><p>${esc(sel.outcome)}</p>
          <small>Read out: ${esc(sel.readout?.metric || "")}${sel.readout?.days ? `, after ${esc(sel.readout.days)} days` : ""}.</small></div>
        <div class="op-reasons">
          <div><h4>Annual value</h4>${sized(sel) ? `<strong>${money(z.annual.low)}–${money(z.annual.high)}</strong><p>Modeled, gross, not incremental. Base ${money(z.annual.base)}: ${esc(num(z.pool.value))} ${esc(z.pool.unit)} × ${pct(z.rate.base)} (${esc(z.rate.basis)}) × ${money(z.value_per_order.value)} × ${esc(z.months)} months.</p>`
            : z ? `<strong>Not sized</strong><p>${esc(z.reason)}</p>` : `<strong>—</strong><p>${sel.category === "fix_first" ? "A fix that protects every other number." : "Not a revenue lever on its own."}</p>`}</div>
          <div><h4>Work</h4><strong>${esc(sel.effort_days)} day${sel.effort_days === 1 ? "" : "s"}</strong><p>Estimated build and QA time.</p></div>
          <div><h4>Evidence</h4><strong style="text-transform:capitalize">${esc(sel.evidence_class)}</strong><p>${sel.check_id ? "From the check library." : "From the " + esc(label(sel.module)) + " analysis."}</p></div>
        </div>
        <h4 style="margin-top:20px">Steps</h4><ol class="op-steps">${(sel.steps || []).map(x => `<li>${esc(x)}</li>`).join("")}</ol>`;
    }
    const gaps = d.gaps || [];
    return `${head(s)}${kpis}
      ${top.length ? `<h2 style="margin:0 0 14px">Fix first</h2><div class="top3">${top.map(c => `<a href="#opportunities/${esc(c.id)}"><span class="op-label">${String(c.rank).padStart(2, "0")} · ${esc(c.severity).toUpperCase()}</span><h3>${esc(c.title)}</h3><p>${esc(c.observation)}</p></a>`).join("")}</div>` : ""}
      <section class="board" aria-labelledby="board-title">
        <div class="board-heading"><p class="eyebrow">DECIDE / DO / LEARN</p><h2 id="board-title">Every opportunity, ranked</h2>
          <p>${cards.length} opportunities from ${new Set(cards.map(c => c.check_id ? "check" : c.module)).size} sources.${total ? ` Sized levers add up to ${money(total.low)}–${money(total.high)} a year (modeled, gross, not incremental; each audience counted once).` : ""} All are proposed until your strategist and you agree an owner.</p></div>
        <div class="toolbar"><div class="sort" role="group" aria-label="Order opportunities by">
            ${[["recommended", "Recommended order"], ["severity", "Most severe"], ["easiest", "Quickest to do"]].map(([k, l]) => `<button type="button" data-sort="${k}" aria-pressed="${S.sort === k}">${l}</button>`).join("")}</div>

          <div class="op-list">${cards.map((o, i) => `<button type="button" class="op-item" data-op="${esc(o.id)}" aria-pressed="${i === idx}">

          <article class="op-detail" aria-label="Selected opportunity">${detail}</article>
        </div>
      </section>
      ${gaps.length ? table("gaps", gaps, [["title", "What we couldn't measure", "text"], ["reason", "Why", "text"], ["unlock", "What it would unlock", "text"]], { title: "What we couldn't see", note: "Unmeasured is listed with its reason, never shown as zero." }) : ""}`;

  foundational(s) {

        <div class="metric"><div class="metric-label">Failed</div><strong>${num(d.by_verdict?.fail)}</strong><p>Checks that need work now.</p></div>
        <div class="metric"><div class="metric-label">Warnings</div><strong>${num(d.by_verdict?.warn)}</strong><p>Checks close to failing, or at risk.</p></div>
        <div class="metric"><div class="metric-label">Couldn't see</div><strong>${num(blind.length)}</strong><p>${pct(d.coverage, 0)} of checks could be scored on this run.</p></div>

      <div class="panel"><div class="panel-head"><div><h2>By area</h2><p>Pass / warn / fail per area of the check library.</p></div></div>
        <div class="table-wrap"><table><thead><tr><th>Area</th><th class="num">Pass</th><th class="num">Warn</th><th class="num">Fail</th><th class="num">Not scored</th></tr></thead><tbody>
        ${areas.map(([a, v]) => `<tr><td style="text-transform:capitalize">${esc(label(a))}</td><td class="num">${v.pass || 0}</td><td class="num">${v.warn || 0}</td><td class="num">${v.fail || 0}</td><td class="num">${(v.na || 0) + (v.error || 0) + (v.not_implemented || 0)}</td></tr>`).join("")}</tbody></table></div></div>

      ${table("blind", blind, [["id", "Check", "text"], ["title", "What it checks", "text"], ["verdict", "Status", "text"], ["message", "Why it couldn't be scored", "text"]], { title: "What we couldn't see", note: "Checks without the data to score them, with the reason.", limit: 60 })}`;

        metric("messages.templates_claims", "With claims-risk wording"), metric("messages.templates_no_unsubscribe", "Without a detectable unsubscribe")])}
      ${findingCards(s.findings)}
      ${table("complaints.sources", T(s, "complaints.sources"), [["kind", "Kind", "text"], ["name", "Source", "text"], ["complaints", "Complaints", "num"], ["complaint_share", "Share", "pct"], ["unsubscribes", "Unsubs", "num"], ["unsubscribe_share", "Share", "pct"], ["revenue", "Attributed", "money"]], { title: "Where complaints and unsubscribes come from", note: "Flows and campaigns, 365 days." })}
      ${table("messages.templates", T(s, "messages.templates"), [["name", "Template", "text"], ["used_in", "Used in", "text"], ["kb", "KB", "dec"], ["images_without_alt", "Images without alt", "num"], ["claims", "Claims-risk terms", "list"], ["issues", "Issues", "list"]], { title: "Every live template" })}
      ${table("messages.link_issues", T(s, "messages.link_issues"), [["url", "Link", "text"], ["issue", "Problem", "text"], ["detail", "Detail", "text"]], { title: "Link problems" })}`;
  },

  plan(s) {
    const d = s.data || {}, plan = d.plan || {}, approved = plan.status === "approved", c = d.campaign;
    const tasks = (plan.tasks || []).map(t => typeof t === "string" ? { title: t } : t);
    const phases = s.narrative_state === "approved" ? s.narrative?.phases || [] : [];
    S.md = `# ${S.b.client.name}: plan\n\nStatus: proposed until approved\n\n`
      + (phases.length ? `## 90 days\n\n${s.narrative.headline}\n\n` + phases.map(p => `### ${p.name} (weeks ${p.weeks})\n\n${p.goal}\n\n`
        + (p.items || []).map(it => `- Week ${it.week}: ${it.ships} (owner: ${it.owner}${it.depends_on ? `; needs: ${it.depends_on}` : ""}${it.kpi ? `; KPI: ${it.kpi}` : ""})`).join("\n")).join("\n\n") + "\n\n" : "")
      + (tasks.length ? `## First 30 days\n\n` + tasks.map((t, i) => `${i + 1}. ${t.title}`).join("\n") + "\n" : "");
    return `${head(s)}<div class="notice">${INFO}<p>${approved ? "<strong>Approved.</strong> These tasks are scheduled." : "<strong>Proposed.</strong> Your Wavy strategist reviews and approves this plan before any work starts."}</p></div>
      ${phases.length && !tasks.length ? `<button class="btn small" type="button" id="plan-md" style="margin-bottom:24px">Export Markdown</button>` : ""}
      ${tasks.length ? `<div class="panel-head"><h2>First 30 days</h2><button class="btn small" type="button" id="plan-md">Export Markdown</button></div><ol class="plan-list">${tasks.map((t, i) => `<li><span class="op-rank">${String(i + 1).padStart(2, "0")}</span><div><strong>${esc(t.title)}</strong></div><span class="tag ${approved ? "live" : "off"}">${approved ? "Approved" : "Proposed"}</span></li>`).join("")}</ol>` : ""}
      ${(d.flows || []).map(f => `<div class="panel"><div class="panel-head"><div><h2>${esc(String(f.name || "").split(" — ")[0])}</h2><p>${f.messages.length} prepared message${f.messages.length === 1 ? "" : "s"} · not sent, not scheduled</p></div><span class="tag ${f.already_live ? "live" : "off"}">${f.already_live ? "Live in Klaviyo" : "Not live"}</span></div>
        ${f.messages.map((m, i) => `<p style="margin-top:8px"><span class="op-label">MESSAGE ${i + 1}</span> <b style="color:#edf0e7;font-weight:500">${esc(m.subject)}</b> · ${esc(m.preview)}</p>`).join("")}</div>`).join("")}
      ${c ? `<div class="grid-2"><div class="panel"><div class="panel-head"><div><h2>${esc(c.title || "Campaign draft")}</h2><p>${esc(c.theme || "")}</p></div><span class="tag ${c.compliance_passed ? "live" : "missing"}">${c.compliance_passed ? "Guardrails passed" : "Needs fixes"}</span></div><div class="email">${esc(c.body_markdown)}</div></div>
        <div class="panel"><h2>Subject lines</h2><ul style="margin:14px 0 20px;padding-left:18px">${(c.subject_line_options || []).map(x => `<li>${esc(x)}</li>`).join("")}</ul>
        <dl class="kv"><dt>Preview text</dt><dd>${esc(c.preview_text)}</dd><dt>Call to action</dt><dd>${esc(c.cta_text)}</dd><dt>Audience</dt><dd>${esc(c.target_segment)}</dd></dl>
        <p style="font-size:13px;margin-top:18px">A draft for review. Nothing has been sent or scheduled.</p></div></div>` : ""}`;
  },

  answers(s) {
    const d = s.data || {}, a = d.answers || {};
    if (!Object.keys(a).length) return `<div class="notice">${INFO}<p><strong>No answers yet.</strong> <a href="/onboard?client=${encodeURIComponent(S.slug)}" style="color:#c8ff00">Open the questionnaire</a></p></div>`;
    const show = v => Array.isArray(v) ? v.join(", ") : v;
    return `${d.submitted_at ? "" : `<div class="notice">${INFO}<p><strong>Not submitted yet.</strong> These are the answers saved so far.</p></div>`}
      ${(d.sections || []).map(sec2 => { const rows = sec2.questions.filter(q => a[q.key]);
        return `<div class="panel"><div class="panel-head"><div><h2>${esc(sec2.title)}</h2><p>${rows.length} of ${sec2.questions.length} answered</p></div></div>
          ${rows.length ? `<dl class="kv">${rows.map(q => `<dt>${esc(q.label)}</dt><dd style="white-space:pre-wrap">${esc(show(a[q.key]))}</dd>`).join("")}</dl>` : `<p class="empty">Nothing answered in this section.</p>`}</div>`; }).join("")}`;
  },

  brand(s) {
    const d = s.data || {}, b = d.brand_identity || {}, e = d.economics || {}, cd = d.campaign_directives || {}, st = d.stated || {};
    const hero = (b.hero_products || []).map(h => typeof h === "string" ? h : h.name).filter(Boolean);
    return `${head(s)}<div class="grid-even">
      <div class="panel"><h2>Voice</h2><dl class="kv" style="margin-top:14px">
        <dt>Archetype</dt><dd>${esc(b.voice_archetype || "—")}</dd>
        <dt>Tone</dt><dd><div class="chips">${(b.tone_descriptors || []).map(t => `<span class="chip">${esc(t)}</span>`).join("") || esc(st.voice_words || "—")}</div></dd>
        <dt>Never say</dt><dd><div class="chips">${(b.forbidden_words || []).map(t => `<span class="chip no">${esc(t)}</span>`).join("") || esc(st.avoid_claims || "—")}</div></dd>
        <dt>Hero products</dt><dd>${hero.map(esc).join(", ") || "—"}</dd></dl></div>
      <div class="panel"><h2>Economics &amp; sending rules</h2><dl class="kv" style="margin-top:14px">
        <dt>Gross margin</dt><dd>${e.gross_margin_pct != null ? esc(e.gross_margin_pct) + "%" : "—"}</dd>
        <dt>Free shipping at</dt><dd>${money(e.free_shipping_threshold)}</dd>
        <dt>Repurchase cycle</dt><dd>${e.typical_consumption_days != null ? esc(e.typical_consumption_days) + " days (stated)" : "—"}</dd>
        <dt>Discounts</dt><dd>${esc(st.discount_stance || label(cd.allowed_discounts || "—").toLowerCase())}${st.deepest_discount ? " · " + esc(st.deepest_discount) : ""}</dd>
        <dt>Regulated category</dt><dd>${esc(st.regulated_category || "—")}</dd>
        <dt>SMS platform</dt><dd>${esc(st.sms_platform || "—")}</dd>
        <dt>KPIs the brand judges us on</dt><dd>${esc((st.kpis || []).join(", ") || "Default set")}</dd></dl></div>
    </div>`;
  },

  sources(s) {
    const d = s.data || {}, run = S.b.run;
    const factRows = Object.entries(S.b.facts || {}).map(([id, f]) => ({ id, ...f, shown: fmtFact(f) ?? "unavailable" }));
    const mods = Object.entries(d.analysis || {}).map(([k, v]) => ({ module: label(k), ...v }));
    const choices = (d.metric_choices || []).map(c => ({ key: c.key, used: c.used ? `${c.used.name} (${c.used.integration || "no integration"})` : "none", status: c.status, reason: c.reason,
      candidates: (c.candidates || []).map(x => `${x.name} · ${x.integration || "—"}${x.events_last_90_days != null ? ` · ${num(x.events_last_90_days)} in 90d` : ""}`).join("; ") }));
    return `<div class="panel"><h2>The run</h2><dl class="kv" style="margin-top:14px">
        <dt>Workspace version</dt><dd>${S.b.version ? `v${esc(S.b.version)}` : "Not published yet"} · built ${esc(day(S.b.generated_at))}</dd>
        ${run ? `<dt>Audit run</dt><dd>${esc(run.id)} · ${esc(run.status)} · ${esc(run.track)} track</dd><dt>Read</dt><dd>${esc(day(run.started_at))}${run.finished_at ? " to " + esc(day(run.finished_at)) : ""}</dd>` : ""}
        <dt>Timezone</dt><dd>${esc(S.b.client?.timezone || "UTC")}</dd>
        ${(d.missing_files || []).length ? `<dt>Missing inputs</dt><dd>${esc(d.missing_files.join(", "))}</dd>` : ""}</dl>
        ${run ? stageList(run) : ""}</div>
      ${table("metric_choices", choices, [["key", "Measure", "text"], ["used", "Metric used", "text"], ["status", "Status", "text"], ["reason", "Why", "text"], ["candidates", "Candidates", "text"]], { title: "Which Klaviyo metrics we used", note: "When an account has more than one order metric, the one with live events wins; the others are listed." })}
      ${table("modules", mods, [["module", "Analysis", "text"], ["status", "Status", "text"], ["reason", "Reason", "text"], ["facts", "Facts", "num"], ["findings", "Findings", "num"]], { title: "Analysis modules" })}
      ${table("facts", factRows, [["id", "Fact", "text"], ["label", "Measures", "text"], ["shown", "Value", "text"], ["window", "Window", "text"], ["time_basis", "Basis", "text"], ["evidence_class", "Evidence", "text"], ["source", "Source", "text"]], { title: "Every number in this workspace", note: "The claim ledger: written analysis may only quote these.", limit: 40 })}
      <div class="panel"><h2>Definitions</h2><dl class="kv" style="margin-top:14px">${(d.definitions || []).map(x => `<dt>${esc(x.term)}</dt><dd>${esc(x.meaning)}</dd>`).join("")}</dl>
        <button class="btn" type="button" id="download" style="margin-top:22px">Download the workspace data (JSON)</button></div>`;
  },
};
VIEWS.opportunities.csv = () => (sec("opportunities").data?.opportunities || []).map(c => ({ rank: c.rank, title: c.title, severity: c.severity, category: c.category, observation: c.observation,
  steps: (c.steps || []).join(" / "), effort_days: c.effort_days, annual_low: c.sizing?.annual?.low, annual_high: c.sizing?.annual?.high, status: c.status, owner: c.owner }));

function wire() {
  document.querySelectorAll("[data-sort]").forEach(b => b.addEventListener("click", () => { S.sort = b.dataset.sort; S.sub = ""; render(); }));
  document.querySelectorAll("[data-op]").forEach(b => b.addEventListener("click", () => {
    S.sub = b.dataset.op; history.replaceState(null, "", "#opportunities/" + encodeURIComponent(S.sub)); render();
    if (matchMedia("(max-width: 850px)").matches) document.querySelector(".op-detail")?.scrollIntoView({ block: "start" });
  }));
  document.querySelectorAll("[data-csv]").forEach(b => b.addEventListener("click", () => {
    if (b.dataset.csv === "opportunities") { const rows = VIEWS.opportunities.csv(); S.csv.opportunities = { rows, cols: Object.keys(rows[0] || {}).map(k => [k, k]) }; }
    csv(b.dataset.csv);
  }));
  document.querySelectorAll("[data-more]").forEach(b => b.addEventListener("click", () => { S.expanded = { ...(S.expanded || {}), [b.dataset.more]: true }; render(); }));
  $("plan-md")?.addEventListener("click", () => download(`${S.slug}-30-day-plan.md`, S.md, "text/markdown"));
  $("download")?.addEventListener("click", () => download(`${S.slug}-workspace-v${S.b.version || "live"}.json`, JSON.stringify(S.b, null, 2), "application/json"));
}

/* ---------------------------------------------------------------- load */
function fail(title, body, link) {
  $("heading").hidden = true;
  $("view").innerHTML = `<div class="state"><h2>${esc(title)}</h2><p>${esc(body)}</p>${link ? `<a href="${esc(link[0])}">${esc(link[1])}</a>` : ""}</div>`;
}
const busy = b => (b.sections || []).some(s => s.state === "collecting") || !!b.in_progress;

async function load(auth, version) {
  const r = await fetch(`/v1/ops/clients/${encodeURIComponent(S.slug)}/workspace${version ? "?version=" + encodeURIComponent(version) : ""}`, auth);
  return r;
}
async function init() {
  S.slug = decodeURIComponent((location.pathname.match(/^\/audit\/([^/]+)/) || [])[1] || "");
  const version = new URLSearchParams(location.search).get("version");
  if (!token()) return signIn();
  const auth = { headers: { Authorization: "Bearer " + token() } };
  const [meR, bR] = await Promise.all([fetch("/v1/ops/me", auth), load(auth, version)]);
  if (meR.status === 401 || bR.status === 401) { sessionStorage.removeItem("wos-token"); return signIn(); }
  S.me = await meR.json();
  $("avatar").textContent = (S.me.name || S.me.email || "?").slice(0, 1).toUpperCase();
  $("avatar").title = S.me.name || "";
  if (S.me.staff) { $("exit").textContent = "Ops console"; $("exit").href = "/console"; }
  else $("exit").addEventListener("click", () => sessionStorage.removeItem("wos-token"));
  $("fresh").addEventListener("click", () => location.assign("/onboard?client=" + encodeURIComponent(S.slug)));
  $("print").addEventListener("click", () => window.print());

  if (bR.status === 404 && !version) return location.replace("/onboard?client=" + encodeURIComponent(S.slug));
  if (!bR.ok) {
    $("client-name").textContent = S.slug; $("crumb-client").textContent = S.slug;
    return version ? fail(`There is no version ${version}`, "That version of the workspace doesn't exist.", [`/audit/${encodeURIComponent(S.slug)}`, "Open the latest version"])
                   : fail("This workspace couldn't be opened", "It may not exist, or this account can't see it.", null);
  }
  S.b = await bR.json();
  const name = S.b.client.name;
  document.title = `${name} | Wavy Client Hub`;
  $("client-name").textContent = name; $("crumb-client").textContent = name; $("foot-client").textContent = `${name} · Wavy Studios`;
  $("mono").textContent = name.trim().slice(0, 1).toUpperCase();
  $("snapshot").textContent = S.b.run?.finished_at ? `Data as of ${day(S.b.run.finished_at)}` : S.b.run ? "Audit in progress" : "No audit yet";
  const sel = $("version"), vs = S.b.versions || [];
  sel.innerHTML = vs.map(v => `<option value="${v.version}"${v.version === S.b.version ? " selected" : ""}>v${v.version} · ${esc(day(v.created_at))}</option>`).join("");
  sel.hidden = vs.length < 2;
  sel.onchange = () => location.assign(`/audit/${encodeURIComponent(S.slug)}?version=${sel.value}${location.hash}`);
  navigate(location.hash.slice(1) || "opportunities", false);
  const poll = async () => {
    const r = await load(auth);
    if (r.ok) { S.b = await r.json(); renderNav(); render(); }
    if (busy(S.b)) S.poll = setTimeout(poll, 15000);
  };
  clearTimeout(S.poll);
  if (busy(S.b) && !version) S.poll = setTimeout(poll, 15000);
}

$("nav").addEventListener("click", e => { const b = e.target.closest("[data-nav]"); if (b) navigate(b.dataset.nav); });
$("trigger").addEventListener("click", openNav);
$("scrim").addEventListener("click", closeNav);
document.addEventListener("keydown", e => { if (e.key === "Escape") closeNav(); });
window.addEventListener("hashchange", () => { if (S.b) navigate(location.hash.slice(1), false); });
init();
</script>
</body>
</html>
