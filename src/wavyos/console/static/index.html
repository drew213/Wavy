<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wavy OS Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
/* Layout: an ops console. Fixed left rail (sections), a top bar (client filter, live clock), and a
   working pane; drill-ins (execution traces) open as a right-hand panel so the list stays in view. */
:root{
  --bg:#0A0A0A; --bg2:#111111; --bg3:#181818; --line:#1F1F1F; --line2:#2A2A2A;
  --text:#FFFFFF; --body:#C9CED6; --muted:#8A9099;
  --lime:#C8FF00; --cyan:#38E1FF; --azure:#4AA8FF; --good:#14B8A6; --warn:#FFC24A; --bad:#FF6B4A;
  --on-accent:#0A0A0A;
  --display:'Syne', system-ui, -apple-system, sans-serif;
  --mono:'Space Mono', ui-monospace, Menlo, monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#FFFFFF; --bg2:#F5F7FA; --bg3:#ECEFF4; --line:#E3E7ED; --line2:#D3D9E1; --text:#0A0A0A; --body:#2B3038; --muted:#5C6470;
  --lime:#5E7A00; --cyan:#0A7EA4; --azure:#1F6FD1; --good:#0E8A7E; --warn:#A86A00; --bad:#D2462A; --on-accent:#FFFFFF; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#FFFFFF; --bg2:#F5F7FA; --bg3:#ECEFF4; --line:#E3E7ED; --line2:#D3D9E1; --text:#0A0A0A; --body:#2B3038; --muted:#5C6470;
  --lime:#5E7A00; --cyan:#0A7EA4; --azure:#1F6FD1; --good:#0E8A7E; --warn:#A86A00; --bad:#D2462A; --on-accent:#FFFFFF; color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--body);font:13px/1.6 var(--mono)}
h1,h2,h3,h4{font-family:var(--display);color:var(--text);margin:0;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.muted{color:var(--muted)} .num{font-variant-numeric:tabular-nums}
.label{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
code,pre{font-family:var(--mono)}
.app{display:grid;grid-template-columns:200px minmax(0,1fr);height:100%}
.rail{border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px;overflow-y:auto}
.rail .brand{padding:0 8px 18px}
.rail .brand h1{font-size:20px;font-weight:800}.rail .brand h1 span{color:var(--lime)}
.rail a{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:6px;color:var(--body);text-decoration:none}
.rail a[aria-current="page"]{background:var(--bg3);color:var(--text)}
.rail a b{font-weight:400;font-size:11px;padding:0 7px;border-radius:999px;background:var(--line2);color:var(--text)}
.rail a b.hot{background:var(--warn);color:var(--on-accent)}
.rail .foot{margin-top:auto;padding:12px 8px 0;border-top:1px solid var(--line);font-size:11.5px}
.main{display:flex;flex-direction:column;min-width:0;height:100%}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 22px;border-bottom:1px solid var(--line)}
.top h2{font-size:22px;font-weight:800;margin-right:auto}
.live{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 0 0 var(--good);animation:pulse 2s infinite}
.dot.off{background:var(--bad);animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--good) 60%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
select,input[type=text],input[type=password],textarea{background:var(--bg2);border:1px solid var(--line2);border-radius:6px;padding:6px 9px}
.content{flex:1;overflow:auto;padding:20px 22px 60px;min-width:0}
.btn{border:1px solid var(--line2);background:var(--bg2);color:var(--text);padding:5px 12px;border-radius:6px;cursor:pointer;font-size:12px}
.btn:hover{border-color:var(--muted)} .btn.primary{background:var(--lime);border-color:var(--lime);color:var(--on-accent);font-weight:700}
.btn.danger{border-color:var(--bad);color:var(--bad)} .btn:disabled{opacity:.4;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;padding:1px 8px;border-radius:999px;border:1px solid var(--line2);white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.plain::before{display:none}
.s-queued,.s-todo,.s-proposed,.s-pending{color:var(--muted)}
.s-running,.s-in_progress{color:var(--cyan)} .s-running::before,.s-in_progress::before{animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}
.s-review,.s-waiting_approval{color:var(--azure)} .s-blocked,.s-failed,.s-rejected,.s-denied,.s-error{color:var(--bad)}
.s-succeeded,.s-done,.s-approved,.s-measured,.s-closed,.s-ok,.s-no_action{color:var(--good)} .s-cancelled,.s-dismissed,.s-inconclusive{color:var(--warn)}
.sev-critical{color:var(--bad)} .sev-high{color:var(--warn)} .sev-medium{color:var(--azure)} .sev-low,.sev-info{color:var(--muted)}
.exec{color:var(--lime)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:14px}
.card{border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:16px}
.card h3{font-size:18px}
.pipe{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:12px 0}
.pipe div{background:var(--bg2);padding:9px 10px}.pipe .n{font-family:var(--display);font-weight:800;font-size:22px;color:var(--text);line-height:1.1}
.bar{height:5px;background:var(--line2);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--lime)}
.bar i.over{background:var(--bad)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.empty{border:1px dashed var(--line2);border-radius:10px;padding:28px;text-align:center}
.empty h3{font-size:17px;margin-bottom:6px}
table{width:100%;border-collapse:collapse}
.tbl{border:1px solid var(--line);border-radius:8px;overflow:auto}
th{text-align:left;font-weight:400;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:9px 12px;background:var(--bg2);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer} tr.click:hover td{background:var(--bg2)} tr.sel td{background:var(--bg3)}
td .t{color:var(--text)}
/* flow board */
.chain{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr) minmax(0,2fr) minmax(0,1fr);overflow-wrap:anywhere;gap:0;border:1px solid var(--line);border-radius:10px;margin-bottom:14px;overflow:hidden}
.chain > div{padding:12px 14px;border-left:1px solid var(--line);min-width:0;position:relative}
.chain > div:first-child{border-left:0}
.chain > div:not(:first-child)::before{content:"→";position:absolute;left:-7px;top:12px;color:var(--muted);background:var(--bg);font-size:12px}
.colhead{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr) minmax(0,2fr) minmax(0,1fr);padding:0 14px 6px}
.ins{padding:6px 0;border-top:1px solid var(--line)} .ins:first-of-type{border-top:0}
.task{border:1px solid var(--line2);border-radius:8px;padding:10px 12px;margin-bottom:8px;background:var(--bg2)}
.task:last-child{margin-bottom:0}
.task .t{color:var(--text);font-weight:700}
.checks{display:flex;gap:3px;margin:6px 0}.checks i{width:16px;height:5px;border-radius:2px;background:var(--line2)}.checks i.p{background:var(--good)}
.dtitle{color:var(--text);font-weight:700;margin:4px 0}
/* trace panel */
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(420px,46%);gap:16px;align-items:start}
.panel{border:1px solid var(--line2);border-radius:10px;background:var(--bg);position:sticky;top:0;max-height:calc(100vh - 110px);overflow:auto}
.panel .head{padding:14px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:1}
.kv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px 12px;margin-top:10px}
.kv div{min-width:0}.kv b{display:block;color:var(--text);font-weight:400;overflow-wrap:anywhere}
.steps{list-style:none;margin:0;padding:8px 16px 16px}
.step{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.step:first-child{border-top:0}
.step .k{width:22px;height:22px;border-radius:5px;display:grid;place-items:center;font-size:10px;font-weight:700;background:var(--bg3);color:var(--text)}
.step.model_call .k{background:var(--lime);color:var(--on-accent)} .step.policy .k{background:var(--azure);color:var(--on-accent)}
.step.denied .k,.step.error .k{background:var(--bad);color:var(--on-accent)}
.step .nm{color:var(--text)} .step .meta{font-size:11px;color:var(--muted)}
details{margin-top:4px} summary{cursor:pointer;color:var(--muted);font-size:11.5px}
pre.j{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--bg2);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:11.5px;max-height:320px;overflow:auto;color:var(--body);margin:6px 0 0}
.art{border-top:1px solid var(--line);padding:12px 16px}
.art pre{white-space:pre-wrap;background:var(--bg2);border-radius:6px;padding:10px;max-height:260px;overflow:auto;color:var(--text)}
.login{max-width:440px;margin:12vh auto;padding:0 16px}
.login h1{font-size:34px;font-weight:800;margin-bottom:6px}.login h1 span{color:var(--lime)}
.err{color:var(--bad)}
.toast{position:fixed;bottom:18px;right:18px;background:var(--text);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:12px}
@media (max-width:900px){.app{grid-template-columns:1fr}.rail{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}.rail .brand,.rail .foot{display:none}
  .split{grid-template-columns:1fr}.panel{position:static;max-height:none}.chain,.colhead{grid-template-columns:1fr}.chain>div{border-left:0;border-top:1px solid var(--line)}.chain>div::before{display:none}.colhead{display:none}.kv{grid-template-columns:repeat(2,1fr)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<script>
(() => {
  const VIEWS = [["overview","Overview"],["flow","Flow"],["review","Review"],["executions","Executions"],["jobs","Jobs"],["approvals","Approvals"],["events","Events"]];
  const S = { token: null, me: null, view: "overview", client: "", sel: null, data: {}, live: false, last: null, err: "", after: 0, events: [] };
  try { S.token = sessionStorage.getItem("wos-token"); S.client = localStorage.getItem("wos-client") || ""; } catch {}
  const $ = (q) => document.querySelector(q);
  const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const ago = (iso) => { if (!iso) return "—"; const d = (Date.now() - new Date(iso.endsWith("Z")||iso.includes("+")?iso:iso+"Z")) / 1000;
    return d < 60 ? Math.max(0,Math.round(d)) + "s ago" : d < 3600 ? Math.round(d/60) + "m ago" : d < 86400 ? Math.round(d/3600) + "h ago" : Math.round(d/86400) + "d ago"; };
  const usd = (n) => "$" + (Number(n)||0).toFixed(n < 1 ? 4 : 2);
  const chip = (s, txt) => `<span class="chip s-${esc(s)}">${esc(txt ?? String(s).replace(/_/g," "))}</span>`;
  const dur = (a, b) => { if (!a) return "—"; const ms = (b ? new Date(b) : new Date()) - new Date(a); return ms < 1000 ? ms + "ms" : ms < 60000 ? (ms/1000).toFixed(1) + "s" : Math.round(ms/60000) + "m"; };
  const pretty = (o) => esc(JSON.stringify(o, null, 2));

  async function api(path, opts = {}) {
    const r = await fetch(path, { ...opts, headers: { "Authorization": "Bearer " + S.token, "Content-Type": "application/json", ...(opts.headers||{}) } });
    if (r.status === 401) { signOut("Your token was rejected. Sign in again."); throw new Error("401"); }
    const body = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(body.error || ("HTTP " + r.status));
    return body;
  }
  function toast(msg) { const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }
  function signOut(msg) { S.token = null; try { sessionStorage.removeItem("wos-token"); } catch {} S.err = msg || ""; renderLogin(); }

  // ------------------------------------------------------------ login
  function renderLogin() {
    $("#root").innerHTML = `<div class="login"><h1>Wavy <span>OS</span></h1><p class="muted">The live view of every client's work: what's running, what each model did, and what's waiting on a person.</p>
      <form id="lf"><label class="label" for="tok">API token</label><div class="row" style="margin-top:6px"><input id="tok" type="password" autocomplete="off" style="flex:1" placeholder="wos_…">
      <button class="btn primary" type="submit">Open console</button></div>${S.err ? `<p class="err">${esc(S.err)}</p>` : ""}
      <p class="muted" style="font-size:11.5px">Get one with <code>wavyos token --email you@…</code>. It stays in this tab only.</p></form></div>`;
    $("#lf").addEventListener("submit", async (e) => { e.preventDefault(); S.token = $("#tok").value.trim(); S.err = "";
      try { S.me = await api("/v1/ops/me"); try { sessionStorage.setItem("wos-token", S.token); } catch {} boot(); } catch (err) { if (S.token) { S.err = "That token didn't work."; renderLogin(); } } });
  }

  // ------------------------------------------------------------ shell
  function shell() {
    const ov = S.data.overview?.clients || [];
    const pendingAp = ov.reduce((a, c) => a + c.approvals_pending, 0);
    const running = ov.reduce((a, c) => a + (c.executions.running || 0), 0);
    const counts = { approvals: pendingAp, executions: running, review: (S.data.review?.drafts || []).filter(d => d.status === "draft" || d.status === "needs_rewrite").length };
    $("#root").innerHTML = `<div class="app"><nav class="rail" aria-label="Sections"><div class="brand"><h1>Wavy <span>OS</span></h1><div class="label">Console</div></div>
      ${VIEWS.map(([k, l]) => `<a href="#${k}" data-v="${k}" aria-current="${S.view === k ? "page" : "false"}">${l}${counts[k] ? `<b class="${k === "approvals" ? "hot" : ""}">${counts[k]}</b>` : ""}</a>`).join("")}
      <a href="/onboard" target="_blank" style="margin-top:12px; border:1px solid var(--lime); color:var(--lime); font-weight:700;">⚡ Onboard Client ↗</a>
      <div class="foot"><div class="t" style="color:var(--text)">${esc(S.me?.name || "")}</div><div class="muted">${esc(S.me?.email || "")}</div><button class="btn" id="so" style="margin-top:8px">Sign out</button></div></nav>
      <div class="main"><div class="top"><h2>${esc(VIEWS.find(v => v[0] === S.view)[1])}</h2>
      <label class="label" for="cf">Client</label><select id="cf"><option value="">All clients</option>${ov.map(c => `<option value="${esc(c.slug)}" ${S.client === c.slug ? "selected" : ""}>${esc(c.name)}</option>`).join("")}</select>
      <span class="live"><span class="dot ${S.live ? "" : "off"}"></span>${S.live ? "Live · " + esc(ago(S.last)) : "Reconnecting…"}</span></div>
      <div class="content" id="content"></div></div></div>`;
    $("#so").onclick = () => signOut();
    $("#cf").onchange = (e) => { S.client = e.target.value; try { localStorage.setItem("wos-client", S.client); } catch {} S.sel = null; refresh(true); };
  }

  // ------------------------------------------------------------ views
  function vOverview() {
    const cs = (S.data.overview?.clients || []).filter(c => !S.client || c.slug === S.client);
    if (!cs.length) return `<div class="empty"><h3>No client workspaces yet</h3><p class="muted">Create one with <code>wavyos client create</code>, or load the demo with <code>wavyos demo</code>.</p></div>`;
    return `<div class="grid">${cs.map(c => {
      const t = c.tasks || {}, d = c.decisions || {}, x = c.executions || {};
      const pct = Math.min(100, (c.spend_today_usd / (c.budget_usd || 1)) * 100);
      return `<div class="card"><div class="row" style="justify-content:space-between"><h3>${esc(c.name)}</h3>${chip(c.status)}</div>
        <div class="muted" style="font-size:11.5px">${esc(c.timezone)} · models: ${c.providers.length ? c.providers.map(p => `<span class="exec">${esc(p)}</span>`).join(", ") : '<span class="err">none allowed</span>'}</div>
        <div class="pipe"><div><div class="label">Insights</div><div class="n num">${c.insights_open}</div><div class="muted">open</div></div>
        <div><div class="label">Decisions</div><div class="n num">${(d.approved||0)}</div><div class="muted">${d.proposed||0} proposed · ${d.closed||0} closed</div></div>
        <div><div class="label">Tasks</div><div class="n num">${(t.in_progress||0)+(t.review||0)}</div><div class="muted">${t.todo||0} to do · ${t.blocked||0} blocked · ${t.done||0} done</div></div>
        <div><div class="label">Results</div><div class="n num">${c.results_pending}</div><div class="muted">being measured</div></div></div>
        <div class="row" style="justify-content:space-between;margin-bottom:6px"><span>${x.running ? chip("running", x.running + " running") : '<span class="muted">nothing running</span>'} ${x.queued ? chip("queued", x.queued + " queued") : ""} ${x.waiting_approval ? chip("waiting_approval", x.waiting_approval + " waiting") : ""} ${x.failed ? chip("failed", x.failed + " failed") : ""}</span>
        ${c.approvals_pending ? `<a href="#approvals" class="chip s-review plain">${c.approvals_pending} approval${c.approvals_pending > 1 ? "s" : ""}</a>` : ""}</div>
        <div class="label" style="display:flex;justify-content:space-between"><span>Model spend today</span><span class="num">${usd(c.spend_today_usd)} / ${usd(c.budget_usd)}</span></div>
        <div class="bar"><i class="${pct >= 100 ? "over" : ""}" style="width:${pct}%"></i></div>
        <div class="row" style="margin-top:12px"><button class="btn" data-open="${esc(c.slug)}">Open flow</button><a class="btn" href="/audit/${encodeURIComponent(c.slug)}">Open audit</a></div></div>`; }).join("")}</div>`;
  }

  function vFlow() {
    const f = S.data.flow;
    if (!S.client) return `<div class="empty"><h3>Pick a client</h3><p class="muted">The flow board shows one client's chain: insight → decision → task → result.</p></div>`;
    if (!f) return `<p class="muted">Loading…</p>`;
    const taskCard = (t) => {
      const ex = t.execution; const can = ["todo","in_progress","blocked"].includes(t.status) && !(ex && ["queued","running"].includes(ex.status));
      return `<div class="task"><div class="row" style="justify-content:space-between"><span class="t">${esc(t.title)}</span>${chip(t.status)}</div>
        <div class="muted" style="font-size:11.5px">${esc(t.owner_role)} · ${esc(t.area.replace(/_/g," "))}${t.due_date ? " · due " + esc(t.due_date) : ""}</div>
        <div class="checks" title="quality checklist">${t.checks.map(c => `<i class="${c.passed ? "p" : ""}" title="${esc(c.text)}"></i>`).join("")}</div>
        ${ex ? `<div class="row" style="font-size:11.5px">${chip(ex.status, ex.purpose + " · " + ex.status.replace(/_/g," "))}<span class="exec">${esc(ex.executor)}${ex.model && ex.model !== ex.executor ? " " + esc(ex.model) : ""}</span><span class="muted">try ${ex.attempt}</span><a href="#executions" data-ex="${esc(ex.id)}">trace</a></div>` : ""}
        ${t.outputs.length ? `<div class="muted" style="font-size:11.5px;margin-top:4px">${t.outputs.length} output${t.outputs.length > 1 ? "s" : ""}: ${t.outputs.map(o => esc(o.label || o.kind)).join(", ")}</div>` : ""}
        ${can ? `<div class="row" style="margin-top:8px"><button class="btn" data-dispatch="${esc(t.id)}">Run with model</button></div>` : ""}</div>`; };
    let h = "";
    if (f.open_insights.length) h += `<div class="card" style="margin-bottom:14px"><div class="label">Open insights without a decision (${f.open_insights.length})</div>${f.open_insights.map(i => `<div class="ins row"><span class="chip plain sev-${esc(i.severity)}">${esc(i.severity)}</span><span style="color:var(--text)">${esc(i.title)}</span><span class="muted">${esc(i.area.replace(/_/g," "))} · ${esc(i.source)} · ${esc(ago(i.created_at))}</span></div>`).join("")}</div>`;
    if (!f.decisions.length && !f.open_insights.length) return h + `<div class="empty"><h3>Nothing in motion for ${esc(f.client.name)}</h3><p class="muted">Insights appear here from audits, jobs and agents. Decisions and tasks follow once someone approves a plan.</p></div>`;
    h += `<div class="colhead label"><span>Insight</span><span>Decision</span><span>Tasks and executions</span><span>Result</span></div>`;
    for (const d of f.decisions) {
      const rs = d.tasks.filter(t => t.result);
      h += `<div class="chain"><div>${d.insights.map(i => `<div class="ins"><span class="chip plain sev-${esc(i.severity)}">${esc(i.severity)}</span><div style="color:var(--text);margin-top:3px">${esc(i.title)}</div></div>`).join("")}</div>
        <div>${chip(d.status)}<div class="dtitle">${esc(d.title)}</div><div class="muted" style="font-size:11.5px">measure ${esc(d.measurement.metric)} over ${esc(d.measurement.window_days)} days</div>
        ${d.scope.length ? `<div class="muted" style="font-size:11.5px;margin-top:4px">plan allows: ${d.scope.map(esc).join(", ")}</div>` : ""}</div>
        <div>${d.tasks.length ? d.tasks.map(taskCard).join("") : '<span class="muted">No tasks yet</span>'}</div>
        <div>${rs.length ? rs.map(t => `<div class="ins">${chip(t.result.status)}<div style="color:var(--text);margin-top:3px">${esc(t.result.metric)}</div><div class="muted" style="font-size:11.5px">${t.result.status === "pending" ? "window closes " + esc(t.result.window_end) : esc(t.result.baseline ?? "—") + " → " + esc(t.result.observed ?? "—")}</div></div>`).join("") : '<span class="muted">Opens when a task is done</span>'}
        ${d.outcome ? `<pre class="j">${esc(d.outcome)}</pre>` : ""}</div></div>`;
    }
    if (f.standing_tasks.length) h += `<div class="label" style="margin:18px 0 8px">Standing work from jobs</div><div class="grid">${f.standing_tasks.map(taskCard).join("")}</div>`;
    return h;
  }

  function vExecutions() {
    const xs = S.data.executions?.executions || [];
    const list = xs.length ? `<div class="tbl"><table><thead><tr><th>Task</th><th>Purpose</th><th>Executor</th><th>Status</th><th>Cost</th><th>Duration</th><th>When</th></tr></thead><tbody>
      ${xs.map(x => `<tr class="click ${S.sel === x.id ? "sel" : ""}" data-ex="${esc(x.id)}" tabindex="0"><td><div class="t">${esc(x.task)}</div><div class="muted">${esc(x.client)} · ${esc(x.role)}</div></td>
      <td>${esc(x.purpose)}${x.attempt > 1 ? ` <span class="muted">#${x.attempt}</span>` : ""}</td><td><span class="exec">${esc(x.executor)}</span><div class="muted">${x.model !== x.executor ? esc(x.model) : ""}</div></td>
      <td>${chip(x.status)}${x.error ? `<div class="err" style="font-size:11px;max-width:260px">${esc(x.error)}</div>` : ""}</td><td class="num">${usd(x.cost_usd)}<div class="muted">${(x.input_tokens + x.output_tokens).toLocaleString()} tok</div></td>
      <td class="num">${dur(x.started_at, x.finished_at)}</td><td class="muted">${esc(ago(x.created_at))}</td></tr>`).join("")}</tbody></table></div>`
      : `<div class="empty"><h3>No executions yet</h3><p class="muted">Run a task from the Flow board, or with <code>POST /v1/ops/clients/{c}/tasks/{id}/dispatch</code>. The worker (<code>wavyos work</code>) picks it up.</p></div>`;
    const d = S.data.exec;

    return `<div class="split"><div>${list}</div>${trace(d)}</div>`;
  }

  function trace(d) {
    const icon = { model_call: "AI", tool_call: "fn", policy: "P", approval: "✓", note: "i", error: "!" };
    return `<aside class="panel" aria-label="Execution trace"><div class="head"><div class="row" style="justify-content:space-between"><span class="label">${esc(d.purpose)} execution · try ${d.attempt}</span><button class="btn" id="closeEx">Close</button></div>
      <h3 style="font-size:18px;margin-top:4px">${esc(d.task)}</h3>
      <div class="kv"><div><span class="label">Status</span><b>${chip(d.status)}</b></div><div><span class="label">Executor</span><b class="exec">${esc(d.executor)}${d.model && d.model !== d.executor ? " " + esc(d.model) : ""}</b></div>
      <div><span class="label">Role</span><b>${esc(d.role)}</b></div><div><span class="label">Cost</span><b class="num">${usd(d.cost_usd)}</b></div>
      <div><span class="label">Tokens in / out</span><b class="num">${d.input_tokens.toLocaleString()} / ${d.output_tokens.toLocaleString()}</b></div><div><span class="label">Duration</span><b>${dur(d.started_at, d.finished_at)}</b></div>
      <div><span class="label">Steps</span><b>${d.steps.length}</b></div><div><span class="label">Packet</span><b title="${esc(d.packet_hash)}">${esc(d.packet_hash.slice(0,10))}…</b></div></div>
      ${d.summary ? `<p style="color:var(--text);margin:10px 0 0">${esc(d.summary)}</p>` : ""}
      ${d.error_full ? `<pre class="j err">${esc(d.error_full)}</pre>` : ""}
      ${["queued","waiting_approval"].includes(d.status) ? `<div class="row" style="margin-top:10px"><button class="btn danger" data-cancel="${esc(d.id)}">Cancel</button></div>` : ""}
      <details><summary>Work packet the model received</summary><pre class="j">${pretty(d.packet)}</pre></details></div>
      <ol class="steps">${d.steps.length ? d.steps.map(st => `<li class="step ${esc(st.kind)} ${esc(st.status)}" data-k="step-${st.seq}"><span class="k" title="${esc(st.kind)}">${icon[st.kind] || "·"}</span><div>
        <div class="row" style="justify-content:space-between"><span class="nm">${esc(st.name)}</span><span>${st.status !== "ok" ? chip(st.status) : ""}</span></div>
        <div class="meta">${esc(st.kind.replace("_"," "))}${st.duration_ms ? " · " + st.duration_ms + "ms" : ""}${st.input_tokens || st.output_tokens ? ` · ${st.input_tokens.toLocaleString()} in / ${st.output_tokens.toLocaleString()} out · ${usd(st.cost_usd)}` : ""}</div>
        ${st.kind === "policy" ? `<div style="font-size:12px">${esc(st.output.outcome)} — ${esc(st.output.reason)}</div>` : ""}
        ${st.kind === "model_call" && st.output.text ? `<div style="font-size:12px;color:var(--text)">${esc(st.output.text.slice(0,280))}</div>` : ""}
        ${Object.keys(st.input).length || Object.keys(st.output).length ? `<details><summary>Input and output</summary><pre class="j">${pretty({input: st.input, output: st.output})}</pre></details>` : ""}</div></li>`).join("")
        : `<li class="muted" style="padding:10px 0">${d.status === "queued" ? "Waiting for a worker to pick this up." : "No steps recorded."}</li>`}</ol>
      ${d.artifacts.map(a => `<div class="art"><div class="row" style="justify-content:space-between"><span class="label">${esc(a.kind.replace(/_/g," "))}</span><span class="muted">${esc(a.id.slice(0,8))}</span></div><div style="color:var(--text);margin:4px 0 6px">${esc(a.label)}</div><pre>${esc(a.content)}</pre></div>`).join("")}</aside>`;

      ${runs.map(r => `<tr><td class="t">${esc(r.job)}</td><td>${esc(r.client)}</td><td>${chip(r.status)}</td><td>${esc(r.summary)}${r.error ? `<div class="err">${esc(r.error)}</div>` : ""}

  function vReview() {
    const ds = S.data.review?.drafts || [];
    const redraft = S.client ? `<div class="row" style="justify-content:space-between;margin-bottom:12px"><span class="muted">Drafts are written from the fact ledger, held to it by the facts check, and scored by a second model. Nothing reaches the brand until you approve it.</span><button class="btn" data-redraft="${esc(S.client)}">Redraft open sections</button></div>` : "";
    const list = ds.length ? `<div class="tbl"><table><thead><tr><th>Section</th><th>Status</th><th>Score</th><th>Facts check</th><th>Cost</th><th>Updated</th></tr></thead><tbody>
      ${ds.map(d => `<tr class="click ${S.selN === d.id ? "sel" : ""}" data-nd="${esc(d.id)}" tabindex="0"><td><div class="t">${esc(d.section.replace(/_/g, " "))}</div><div class="muted">${esc(d.client_name)}</div>${d.headline ? `<div style="font-size:11.5px;max-width:380px">${esc(d.headline)}</div>` : ""}</td>
      <td>${chip(d.status === "draft" ? "review" : d.status === "needs_rewrite" ? "blocked" : d.status === "edited" ? "approved" : d.status, d.status.replace(/_/g, " "))}${d.reason ? `<div class="muted" style="font-size:11px;max-width:280px">${esc(d.reason)}</div>` : ""}</td>
      <td class="num">${d.score == null ? "—" : esc(d.score) + "/10"}<div class="muted">${d.rounds} round${d.rounds === 1 ? "" : "s"}${d.independent === false ? " · same provider" : ""}</div></td>
      <td>${d.facts_ok == null ? "—" : d.facts_ok ? chip("ok", "clean") : chip("failed", d.problems + " problem" + (d.problems === 1 ? "" : "s"))}${d.cut ? `<div class="muted">${d.cut} cut</div>` : ""}</td>
      <td class="num">${usd(d.cost_usd)}<div class="muted">${esc(d.drafter)}${d.critic_by ? " → " + esc(d.critic_by) : ""}</div></td><td class="muted">${esc(ago(d.updated_at))}</td></tr>`).join("")}</tbody></table></div>`
      : `<div class="empty"><h3>No drafts${S.client ? " for this client" : ""}</h3><p class="muted">Sections are drafted after each scored audit, for brands whose settings allow a model provider.</p></div>`;
    const d = S.data.nd;
    if (!S.selN || !d) return redraft + list;
    const fact = (id) => (d.evidence || []).find(e => e.id === id);
    const val = (e) => e ? (e.missing ? "not in the ledger" : e.value == null ? "unavailable" : `${e.value}${e.unit ? " " + e.unit : ""}`) : "—";
    const p = d.payload || {}, fc = d.facts_check || {}, rounds = d.critic?.rounds || [];
    const open = d.approval && d.approval.status === "pending";
    const panel = `<aside class="panel" aria-label="Draft review"><div class="head"><div class="row" style="justify-content:space-between"><span class="label">${esc(d.client_name)} · ${esc(d.section)}</span><button class="btn" id="closeNd">Close</button></div>
      <h3 style="font-size:18px;margin-top:4px">${esc(p.headline || "(no headline)")}</h3>
      <div class="kv"><div><span class="label">Status</span><b>${chip(d.status)}</b></div><div><span class="label">Score</span><b>${d.score == null ? "—" : esc(d.score) + "/10"}</b></div>
      <div><span class="label">Writer → critic</span><b class="exec">${esc(d.drafter)} → ${esc(d.critic_by)}</b></div><div><span class="label">Cost</span><b class="num">${usd(d.cost_usd)}</b></div></div>
      ${d.reason ? `<p class="err" style="margin:10px 0 0">${esc(d.reason)}</p>` : ""}</div>
      <div class="art">${(p.insights || []).map((x, i) => `<div style="padding:10px 0;border-top:1px solid var(--line)"><span class="label">Insight ${i + 1}${x.owner ? " · " + esc(x.owner) : ""}${x.when ? " · " + esc(x.when) : ""}</span>
        <div style="color:var(--text);margin-top:4px">${esc(x.finding)}</div><div><span class="muted">Evidence:</span> ${esc(x.evidence)}</div><div><span class="muted">Action:</span> <span style="color:var(--text)">${esc(x.action)}</span></div>
        ${(x.facts || []).length ? `<table style="margin-top:6px"><tbody>${x.facts.map(id => { const e = fact(id); return `<tr><td class="muted" style="padding:3px 8px 3px 0">${esc(id)}</td><td style="padding:3px 0">${esc(e?.label || "")}</td><td class="num" style="padding:3px 0 3px 8px;color:var(--text)">${esc(val(e))}</td></tr>`; }).join("")}</tbody></table>` : `<div class="err" style="font-size:11.5px">Cites no facts.</div>`}</div>`).join("")}
        ${["cards", "ultimate_journey", "calendar_90d", "phases"].filter(k => p[k]).map(k => `<details><summary>${esc(k.replace(/_/g, " "))} (${p[k].length})</summary><pre class="j">${pretty(p[k])}</pre></details>`).join("")}</div>
      <div class="art"><span class="label">Facts check</span> ${fc.ok ? chip("ok", "every number is in the ledger") : chip("failed", (fc.problems || []).length + " problem(s)")} <span class="muted">${fc.numbers_checked ?? 0} numbers checked</span>
        ${(fc.problems || []).map(x => `<div class="err" style="font-size:11.5px">${esc(x.path)}: ${esc(x.reason)}${x.token ? ` (${esc(x.token)})` : ""}</div>`).join("")}
        ${(fc.cut || []).map(x => `<div class="muted" style="font-size:11.5px">Cut ${esc(x.path)}: ${esc(x.reason)}</div>`).join("")}
        ${(fc.warnings || []).map(x => `<div style="font-size:11.5px;color:var(--warn)">${esc(x.path)}: ${esc(x.reason)}</div>`).join("")}</div>
      <div class="art"><span class="label">Critic${d.critic?.independent === false ? " (same provider: not independent)" : ""}</span>${rounds.map(r => `<details ${r === rounds[rounds.length - 1] ? "open" : ""}><summary>Round ${r.round}: ${esc(r.total)}/10 · ${r.problems} facts problem(s)</summary>
        <div class="muted" style="font-size:11.5px">${Object.entries(r.scores || {}).map(([k, v]) => `${esc(k)} ${esc(v)}`).join(" · ")}</div>${(r.notes || []).map(n => `<div style="font-size:12px">• ${esc(n)}</div>`).join("")}</details>`).join("") || '<div class="muted">Not critiqued.</div>'}</div>
      ${(d.diff || []).length ? `<div class="art"><span class="label">Strategist edits (${d.diff.length})</span><pre class="j">${pretty(d.diff)}</pre></div>` : ""}
      ${["approved", "edited", "rejected"].includes(d.status) ? `<div class="art muted">${esc(d.status)} by ${esc(d.reviewer || "")} ${esc(ago(d.reviewed_at))}${d.review_note ? ": " + esc(d.review_note) : ""}</div>` : ""}
      ${d.status === "skipped" || d.status === "drafting" ? "" : `<div class="art" data-k="nd-${esc(d.id)}"><details><summary>Edit the draft (JSON). Saving runs the facts check and publishes it as edited.</summary>
        <textarea id="nj-${esc(d.id)}" rows="14" style="width:100%;margin-top:6px">${esc(JSON.stringify(p, null, 2))}</textarea></details>
        <label class="label" for="nn-${esc(d.id)}" style="display:block;margin-top:10px">Note</label><textarea id="nn-${esc(d.id)}" rows="2" style="width:100%"></textarea>
        <div class="row" style="margin-top:8px">${open ? `<button class="btn primary" data-ndok="1" data-id="${esc(d.id)}">Approve</button>` : ""}<button class="btn" data-ndedit="${esc(d.id)}">Save edit</button>${d.status !== "rejected" ? `<button class="btn danger" data-ndok="0" data-id="${esc(d.id)}">Reject</button>` : ""}</div></div>`}</aside>`;
    return redraft + `<div class="split"><div>${list}</div>${panel}</div>`;
  }

  function vEvents() {
    const ev = S.events.filter(e => !S.client || e.client === S.client).slice(-300).reverse();
    if (!ev.length) return `<div class="empty"><h3>No events yet</h3><p class="muted">Every change in Wavy OS is written here, chained by hash.</p></div>`;
    return `<div class="tbl"><table><thead><tr><th>When</th><th>Client</th><th>Who</th><th>What</th><th>Summary</th><th>Hash</th></tr></thead><tbody>
      ${ev.map(e => `<tr><td class="muted" style="white-space:nowrap">${esc(ago(e.at))}</td><td>${esc(e.client || "org")}</td><td>${esc(e.actor)}<div class="muted">${esc(e.role)}</div></td>
      <td>${chip(e.action.split(".").pop(), e.action)}</td><td>${esc(e.summary)}</td><td class="muted">${esc(e.hash)}</td></tr>`).join("")}</tbody></table></div>`;
  }

  function render() {
    shell();
    const v = { overview: vOverview, flow: vFlow, review: vReview, executions: vExecutions, jobs: vJobs, approvals: vApprovals, events: vEvents }[S.view];
    $("#content").innerHTML = v();
  }

  // ------------------------------------------------------------ data
  const qc = () => S.client ? "client=" + encodeURIComponent(S.client) : "";
  async function refresh(redraw) {
    try {
      S.data.overview = await api("/v1/ops/overview");
      if (S.view === "flow" && S.client) S.data.flow = await api(`/v1/ops/clients/${encodeURIComponent(S.client)}/flow`);
      if (S.view === "executions") { S.data.executions = await api("/v1/ops/executions?" + qc()); if (S.sel) S.data.exec = await api("/v1/ops/executions/" + S.sel); }
      if (S.view === "jobs") S.data.jobs = await api("/v1/ops/jobs");
      if (S.view === "approvals") S.data.approvals = await api("/v1/ops/approvals");
      if (S.view === "review" && S.me?.staff) { S.data.review = await api("/v1/ops/narrative?" + qc()); S.data.nd = S.selN ? await api("/v1/ops/narrative/" + S.selN) : null; }
      const ev = await api("/v1/ops/events?after=" + S.after);
      if (ev.events.length) { S.events = S.events.concat(ev.events).slice(-1000); S.after = ev.events[ev.events.length - 1].id; }
      S.live = true; S.last = new Date().toISOString();
    } catch (e) { if (e.message !== "401") S.live = false; }
    if (!S.token) return;
    // Redraw only when something changed, so open details, scroll and typing survive the live refresh.
    const sig = JSON.stringify([S.view, S.client, S.sel, S.data.overview?.clients, S.view === "flow" && S.data.flow,
      S.view === "executions" && [S.data.executions, S.data.exec], S.view === "jobs" && S.data.jobs,
      S.view === "approvals" && S.data.approvals, S.view === "review" && [S.data.review, S.data.nd], S.view === "events" && S.after, S.live]);
    if (!redraw && sig === S.sig) { const l = document.querySelector(".live"); if (l) l.lastChild.textContent = "Live · " + ago(S.last); return; }
    S.sig = sig;
    const a = document.activeElement; const keep = a && a.id && a.tagName === "TEXTAREA" ? [a.id, a.value] : null;
    const open = [...document.querySelectorAll("details[open] > summary")].map(x => x.textContent + "|" + (x.closest("[data-k]")?.dataset.k || ""));
    const sc = $("#content")?.scrollTop, ps = document.querySelector(".panel")?.scrollTop;
    render();
    document.querySelectorAll("details > summary").forEach(x => { if (open.includes(x.textContent + "|" + (x.closest("[data-k]")?.dataset.k || ""))) x.parentElement.open = true; });
    if (keep) { const el = document.getElementById(keep[0]); if (el) { el.value = keep[1]; el.focus(); } }
    if (sc && !redraw) $("#content").scrollTop = sc;
    if (ps) { const p = document.querySelector(".panel"); if (p) p.scrollTop = ps; }
  }

  document.addEventListener("click", async (e) => {
    const t = e.target.closest("[data-v],[data-open],[data-ex],[data-dispatch],[data-ap],[data-cancel],#closeEx,[data-nd],[data-ndok],[data-ndedit],[data-redraft],#closeNd"); if (!t) return;
    if (t.id === "closeNd") { S.selN = null; S.data.nd = null; render(); return; }
    if (t.dataset.nd) { S.selN = t.dataset.nd; refresh(true); return; }
    if (t.dataset.ndok) { const ok = t.dataset.ndok === "1", id = t.dataset.id, note = document.getElementById("nn-" + id)?.value || "";
      try { const r = await api(`/v1/ops/narrative/${id}/decide`, { method: "POST", body: JSON.stringify({ approve: ok, note }) }); toast(r.status === "rejected" ? "Rejected" : "Approved and published"); } catch (err) { toast(err.message); }
      refresh(true); return; }
    if (t.dataset.ndedit) { const id = t.dataset.ndedit; let payload;
      try { payload = JSON.parse(document.getElementById("nj-" + id).value); } catch { toast("That isn't valid JSON"); return; }
      const note = document.getElementById("nn-" + id)?.value || "";
      const r = await fetch(`/v1/ops/narrative/${id}/edit`, { method: "POST", headers: { "Authorization": "Bearer " + S.token, "Content-Type": "application/json" }, body: JSON.stringify({ payload, note }) });
      const body = await r.json().catch(() => ({}));
      if (r.ok) toast("Saved and published as edited");
      else toast((body.problems || []).slice(0, 3).map(p => `${p.path}: ${p.reason}${p.token ? " (" + p.token + ")" : ""}`).join(" · ") || body.error || "Not saved");
      refresh(true); return; }
    if (t.dataset.redraft) { try { await api(`/v1/ops/clients/${encodeURIComponent(t.dataset.redraft)}/narrative`, { method: "POST", body: "{}" }); toast("Drafting queued; reviewed sections are kept"); } catch (err) { toast(err.message); } refresh(); return; }
    if (t.dataset.v) { e.preventDefault(); location.hash = t.dataset.v; return; }
    if (t.dataset.open) { S.client = t.dataset.open; location.hash = "flow"; return; }
    if (t.id === "closeEx") { S.sel = null; S.data.exec = null; render(); return; }
    if (t.dataset.ex) { e.preventDefault(); S.sel = t.dataset.ex; if (S.view !== "executions") { location.hash = "executions"; } else refresh(); return; }
    if (t.dataset.dispatch) { t.disabled = true;
      try { const r = await api(`/v1/ops/clients/${encodeURIComponent(S.client)}/tasks/${t.dataset.dispatch}/dispatch`, { method: "POST", body: "{}" }); toast(`Queued for ${r.executor} ${r.model}`); } catch (err) { toast(err.message); }
      refresh(); return; }
    if (t.dataset.cancel) { try { await api(`/v1/ops/executions/${t.dataset.cancel}/cancel`, { method: "POST" }); toast("Cancelled"); } catch (err) { toast(err.message); } refresh(); return; }
    if (t.dataset.ap) { const ok = t.dataset.ok === "1"; const note = document.getElementById("n-" + t.dataset.ap)?.value || "";
      try { const r = await api(`/v1/ops/approvals/${t.dataset.ap}/decide`, { method: "POST", body: JSON.stringify({ approve: ok, note }) }); toast(ok ? "Approved" : "Rejected"); } catch (err) { toast(err.message); }
      refresh(); }
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Enter" && e.target.matches("tr[data-ex],tr[data-nd]")) e.target.click(); });
  window.addEventListener("hashchange", () => { const v = location.hash.slice(1); if (VIEWS.some(x => x[0] === v)) { S.view = v; refresh(true); } });

  let timer;
  function boot() {
    const v = location.hash.slice(1); if (VIEWS.some(x => x[0] === v)) S.view = v;
    refresh(true);
    clearInterval(timer);
    timer = setInterval(() => { if (!document.hidden && S.token) refresh(); }, 2500);
  }
  if (S.token) api("/v1/ops/me").then(me => { S.me = me; boot(); }).catch(() => {}); else renderLogin();
})();
</script>
</body>
</html>
