# Render Blueprint: the API and console, one background worker, and Postgres.
# Dashboard → New → Blueprint → pick this repo. Render asks for the values marked sync: false.

envVarGroups:
  - name: wavyos-shared
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: WAVYOS_SIGNUP_ORG
        value: wavy
      # Encrypts every stored Klaviyo and model key. Generated once by Render; back it up
      # (Environment Groups → wavyos-shared). Changing it makes stored keys unreadable.
      - key: WAVYOS_MASTER_KEY
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false

services:
  - type: web
    name: wavyos-web
    runtime: python
    plan: starter
    region: oregon
    buildCommand: pip install --upgrade pip && pip install .
    preDeployCommand: wavyos init-db && wavyos ensure-admin
    startCommand: wavyos serve --host 0.0.0.0 --port $PORT --forwarded-allow-ips '*'
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - fromGroup: wavyos-shared
      - key: WAVYOS_DATABASE_URL
        fromDatabase:
          name: wavyos-db
          property: connectionString
      # The first staff admin, created on the first deploy. The password is only set if the
      # admin has none, so clear it from here after the first sign-in.
      - key: WAVYOS_ADMIN_EMAIL
        sync: false
      - key: WAVYOS_ADMIN_PASSWORD
        sync: false

  - type: worker
    name: wavyos-worker
    runtime: python
    plan: starter
    region: oregon
    buildCommand: pip install --upgrade pip && pip install .
    # Runs audits and agent work, and queues scheduled jobs every 5 minutes (no separate cron).
    startCommand: wavyos init-db && wavyos work --loop --interval 2 --schedule-every 300
    autoDeploy: true
    envVars:
      - fromGroup: wavyos-shared
      - key: WAVYOS_DATABASE_URL
        fromDatabase:
          name: wavyos-db
          property: connectionString

databases:
  - name: wavyos-db
    plan: basic-256mb
    region: oregon
    databaseName: wavyos
    user: wavyos
    postgresMajorVersion: "17"
    ipAllowList: []  # reachable only from the services above
